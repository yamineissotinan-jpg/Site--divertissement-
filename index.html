<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Et si ?</title><style>body{margin:0;background:#080b12;color:#eef2f7;font:16px system-ui;line-height:1.7}main{max-width:900px;margin:auto;padding:35px 18px}h1{font-size:64px;margin:0 0 8px}textarea{width:100%;height:150px;background:#111827;color:white;border:1px solid #334155;border-radius:14px;padding:16px;font-size:18px;box-sizing:border-box}button{background:#162235;color:white;border:1px solid #334155;border-radius:10px;padding:11px 15px;cursor:pointer;margin:6px 4px 6px 0}button:hover{border-color:#6ee7c7}.primary{background:#6ee7c7;color:#06110d;font-weight:800}.story{margin-top:25px}.chapter{background:#101722;border:1px solid #263447;border-radius:16px;padding:24px;margin:14px 0}.chapter h2{margin-top:0}.meta{color:#8de8cf;font-size:12px;text-transform:uppercase;letter-spacing:2px}.small{color:#94a3b8;font-size:13px}.sources{border-top:1px solid #263447;margin-top:25px;padding-top:15px}.source a{color:#8de8cf}.hide{display:none}</style></head><body><main><div class="small">LABORATOIRE DE RÉALITÉS ALTERNATIVES</div><h1>Et si… ?</h1><p>Imagine une autre réalité. Le contexte réel sert de point de départ ; ce qui suit est une fiction.</p><textarea id="prompt" placeholder="Exemple : Et si Beyoncé était blanche ?"></textarea><br><button class="primary" id="go">Entrer dans l'histoire</button><button id="clear">Nouvelle</button><div id="out" class="story"></div></main><script>
const $=x=>document.getElementById(x);const clean=x=>x.trim().replace(/\s+/g,' ');let last='';
function typeOf(q){let x=q.toLowerCase();if(/beyonce|chanteur|chanteuse|acteur|actrice|artiste|celebrite|star/.test(x))return'personne';if(/humain.*dispar|humanite.*dispar|plus d'humain/.test(x))return'extinction';if(/internet|technolog|robot|intelligence artificielle|ordinateur/.test(x))return'technologie';if(/napoleon|waterloo|empire|rome|roi |reine |guerre|histoire/.test(x))return'histoire';if(/lune|mars|gravite|planete|espace|terre/.test(x))return'science';if(/foret|climat|pollution|abeille|animal|ocean|ecosystem/.test(x))return'ecologie';if(/argent|entreprise|economie|invest|million|milliard|marche/.test(x))return'economie';if(/president|gouvernement|ville|societe|population|ecole/.test(x))return'societe';return'general'}
function personName(q){let x=q.replace(/^\s*(et\s+si|imagine|supposons\s+que)\s+/i,'');let m=x.match(/^([^?]+?)\s+(?:était|etait|était née|etait nee|était né|etait ne|avait|n'était|n'etait)\b/i);return m?m[1].trim():x.replace(/[?!.].*$/,'').trim()}
const data={person:['Le jour où cette autre vie commence','L’enfance qui aurait pu être différente','La rencontre qui change tout','Le premier choix','Le monde découvre cette nouvelle personne','Le prix de la réussite','Le moment où tout aurait pu s’arrêter','Une vie devenue publique','Des années plus tard','Épilogue'],extinction:['Le dernier soir','Les premières heures','Le premier silence','La première année','Dix ans plus tard','Les villes sans voix','Un siècle plus tard','Cinq siècles plus tard','Les dernières traces','Épilogue'],technologie:['Le jour du basculement','Les premières heures','La semaine où tout change','La première réaction','Les habitudes se brisent','Les pouvoirs réagissent','Une nouvelle génération','Le nouvel équilibre','Ce que personne n’avait prévu','Épilogue'],histoire:['Le jour où l’histoire bifurque','Les premières conséquences','Le choix décisif','La nouvelle carte du monde','Les vainqueurs découvrent le prix de leur victoire','Une génération plus tard','Les mémoires changent','Un siècle plus tard','Le monde issu de cette décision','Épilogue'],science:['Le premier changement','La découverte','Les premières conséquences','Le détail inattendu','L’adaptation','La nouvelle normalité','Une génération plus tard','Les effets lointains','Un monde différent','Épilogue'],ecologie:['Le premier déséquilibre','La réaction du vivant','La chaîne commence','Les premières transformations','Les humains comprennent','La nouvelle compétition','Une génération plus tard','Le nouvel équilibre','Les conséquences oubliées','Épilogue'],economie:['Le choc initial','Les marchés réagissent','Les entreprises changent','Les familles s’adaptent','Les pouvoirs publics interviennent','Les nouveaux gagnants','Une nouvelle économie','Une génération plus tard','Le nouvel équilibre','Épilogue'],societe:['Le premier jour','La réaction collective','Les institutions changent','La vie quotidienne bascule','Les tensions apparaissent','Une nouvelle organisation','Une génération plus tard','Les gagnants et les perdants','La nouvelle société','Épilogue'],general:['Le point de divergence','Les premières conséquences','Le monde commence à changer','Les réactions humaines','Le détail que personne n’avait prévu','Une nouvelle trajectoire','Une génération plus tard','Le monde transformé','Ce que personne n’avait imaginé','Épilogue']};
function paragraph(kind,q,i){let n=personName(q);if(kind==='person'){let lines=[`Dans cette réalité, ${n} naît dans une histoire différente. Ce n’est pas seulement une apparence qui change : autour de cette personne, les circonstances prennent progressivement une autre forme. La famille, le quartier, les rencontres et les occasions n’ont plus exactement la même combinaison.`,`Les premières années passent sans que personne ne puisse mesurer ce que cette petite différence provoquera. À l’école, certaines rencontres arrivent plus tôt, d’autres n’arrivent jamais. Une personne qui, dans notre réalité, aurait joué un rôle important peut ici rester un parfait inconnu. C’est ainsi que les vies bifurquent : rarement par un grand événement, souvent par une porte ouverte quelques minutes plus tôt.`,`Puis vient la musique, le travail, l’ambition ou la rencontre qui donne à cette histoire son premier véritable tournant. ${n} commence à comprendre qu’une carrière ne dépend pas uniquement du talent. Il faut être au bon endroit, rencontrer les bonnes personnes et parfois accepter un risque que personne autour de soi ne comprend.`,`Le public finit par découvrir cette autre trajectoire. Les premières réactions sont contradictoires. Certains admirent, d’autres critiquent, d’autres encore projettent sur cette personne des choses qui n’ont rien à voir avec ce qu’elle voulait devenir. Et c’est précisément à ce moment que l’histoire devient intéressante : le personnage doit choisir ce qu’il veut faire de cette vie qui lui a été donnée.`,`Quelques années plus tard, une décision prise presque sur un coup de tête produit une conséquence inattendue. Une rencontre ouvre une porte, une autre se ferme. La carrière accélère. Les proches voient alors quelque chose que le public ne voit jamais : derrière le personnage connu, il y a toujours quelqu’un qui doute, qui hésite et qui se demande parfois ce qui serait arrivé s’il avait choisi autrement.`];return lines[i%lines.length]}
if(kind==='extinction'){let l=[`À la fin, personne ne sait exactement quand le dernier être humain a disparu. Il n’y a pas de cérémonie. Pas de dernier discours. Simplement des maisons dont les portes restent ouvertes et des téléphones qui cessent progressivement de sonner.`,`Pendant quelques heures, le monde continue presque normalement. Des systèmes automatiques fonctionnent encore. Des feux passent au vert. Des avions sont pourtant déjà au sol. La différence est invisible jusqu’au moment où quelqu’un aurait dû intervenir et où personne ne vient.`,`Puis les petites machines commencent à s’arrêter. Les réseaux électriques se fragmentent. L’eau cesse d’arriver dans certains immeubles. Dans les villes, le silence gagne étage après étage. La nature ne conquiert pas immédiatement les rues ; elle attend simplement que personne ne vienne la repousser.`,`Les années passent. Les vitres se brisent, les toits fuient, les racines soulèvent le béton. Des animaux occupent des lieux qui leur étaient autrefois interdits. Une ville qui semblait éternelle devient lentement un paysage.`,`Après plusieurs siècles, la planète n’a pas oublié l’humanité aussi complètement qu’on pourrait le croire. Certaines constructions résistent. Quelques objets subsistent dans des endroits protégés. Mais pour les espèces qui vivent alors, l’époque humaine ressemble déjà à une couche ancienne du monde.`];return l[i%l.length]}
let generic=[`Au début, presque personne ne comprend l’importance du changement. La journée ressemble à toutes les autres. Les gens travaillent, discutent, prennent des décisions ordinaires. Pourtant, une petite différence vient d’ouvrir une autre trajectoire.`,`La nouvelle se répand et chacun l’interprète à sa manière. Les médias cherchent des explications, les spécialistes essaient de comprendre, tandis que les personnes directement concernées doivent simplement continuer à vivre.`,`Puis une première conséquence apparaît. Elle n’était pas forcément prévue, mais elle devient difficile à ignorer. Une décision provoque une autre décision, qui entraîne à son tour une réaction. Peu à peu, le scénario cesse d’être une simple hypothèse : il devient une nouvelle réalité.`,`Quelques années passent. Une génération grandit avec cette réalité comme quelque chose de normal. Ce qui paraissait impossible au départ devient banal, tandis que d’anciens problèmes disparaissent et que de nouveaux apparaissent.`,`Et pourtant, le plus important n’était pas encore arrivé. Une conséquence secondaire, presque invisible au départ, finit par modifier toute la trajectoire.`];return generic[i%generic.length]}
async function run(){let q=clean($('prompt').value);if(!q){$('prompt').focus();return}last=q;$('out').innerHTML='<div class="chapter"><div class="meta">Construction de la réalité alternative</div><h2>Un instant…</h2><p>Je pars du monde réel comme point de départ, puis je laisse l’hypothèse modifier l’histoire.</p></div>';let kind=typeOf(q);let titles=data[kind]||data.general;let html=`<div class="chapter"><div class="meta">FICTION — ${kind}</div><h2>${q.replace(/[<>]/g,'')}</h2><p>Cette histoire est imaginaire. Les informations réelles servent seulement de contexte de départ.</p></div>`;for(let i=0;i<titles.length;i++){await new Promise(r=>setTimeout(r,30));html+=`<article class="chapter"><div class="meta">${titles[i]}</div><h2>${titles[i]}</h2><p>${paragraph(kind,q,i)}</p><p>${paragraph(kind,q,i+2)}</p></article>`}$('out').innerHTML=html;window.scrollTo({top:$('out').offsetTop-20,behavior:'smooth'})}
$('go').onclick=run;$('clear').onclick=()=>{$('prompt').value='';$('out').innerHTML='';last='';$('prompt').focus()};$('prompt').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')run()});
})();</script></body></html>
