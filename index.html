:root{--bg:#070a11;--panel:#0e1420;--line:#26334a;--text:#f4f7fb;--muted:#9aa8bd;--a:#8ff0d0;--danger:#ff9eac}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#1d2b48 0,#070a11 58%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px 16px 80px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-weight:900;letter-spacing:.22em;color:var(--a);font-size:12px}.nav,.toolbar,.modes,.chips,.actions,.tags{display:flex;gap:7px;flex-wrap:wrap}.btn,.chip{border:1px solid var(--line);background:#101827;color:var(--text);border-radius:12px;padding:10px 13px;font-weight:700;cursor:pointer}.btn:hover,.chip:hover{border-color:#71809a}.primary{background:var(--a);color:#06100d;border-color:var(--a)}.danger{color:var(--danger)}.hero{text-align:center;padding:60px 0 28px}.hero h1{font-size:clamp(58px,11vw,110px);line-height:.86;letter-spacing:-.08em;margin:0 0 20px}.hero p{max-width:680px;margin:auto;color:#b5c0d0;font-size:18px;line-height:1.6}.box{background:#0e1420ee;border:1px solid var(--line);border-radius:24px;padding:15px;box-shadow:0 25px 80px #0008}.prompt{width:100%;min-height:160px;resize:vertical;background:#080c14;color:#fff;border:1px solid #2a3850;border-radius:17px;padding:18px;font:inherit;font-size:19px;line-height:1.55;outline:none}.prompt:focus{border-color:var(--a);box-shadow:0 0 0 3px #8ff0d018}.toolbar{align-items:center;margin-top:10px}.status{margin-left:auto;color:var(--muted);font-size:13px}.mode.active{color:var(--a);border-color:var(--a)}.progress{height:4px;background:#182338;border-radius:9px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;width:0;background:var(--a);transition:width .25s}.chips{margin-top:12px}.chip{border-radius:999px;color:#bcc7d8;padding:8px 12px}.workspace{margin-top:26px}.empty{text-align:center;color:var(--muted);padding:50px 20px;border:1px dashed #2a3850;border-radius:20px}.cover{padding:32px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#152138,#0a1019)}.kicker{color:var(--a);font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.cover h2{font:700 clamp(30px,5vw,54px)/1.08 Georgia,serif;margin:9px 0 15px}.cover p{color:#c4cedc;line-height:1.7}.tag{border:1px solid #30405a;border-radius:99px;padding:5px 9px;color:#aab7c9;font-size:12px}.chapter{margin-top:14px;padding:30px;border:1px solid #202d43;background:#0d1320dd;border-radius:20px}.chapter h3{font:700 30px/1.15 Georgia,serif;margin:0 0 20px}.chapter p{font:19px/1.9 Georgia,serif;color:#e3e8f0;margin:0 0 18px}.scene{border-left:2px solid var(--a);padding-left:18px;margin:24px 0;color:#d7dfeb;font:18px/1.75 Georgia,serif}.choices{margin-top:20px;padding:18px;background:#080d16;border:1px solid var(--line);border-radius:18px}.choices .btn{display:block;width:100%;text-align:left;margin:8px 0}.side{position:fixed;z-index:50;right:18px;top:18px;width:min(410px,calc(100vw - 36px));max-height:calc(100vh - 36px);overflow:auto;background:#0b111cf8;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 25px 90px #000b}.sidehead{display:flex;justify-content:space-between;align-items:center}.saved{border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0}.saved b{display:block;margin-bottom:5px}.saved small{color:var(--muted)}.saved .row{display:flex;gap:6px;margin-top:9px}.hidden{display:none!important}.toast{position:fixed;z-index:100;bottom:24px;left:50%;transform:translateX(-50%);background:#f4f7fb;color:#071018;padding:11px 16px;border-radius:12px;font-weight:800;box-shadow:0 15px 40px #0008}@media(max-width:650px){.hero{padding:42px 0 24px}.hero h1{font-size:65px}.status{width:100%;margin-left:0}.chapter{padding:21px}.chapter p{font-size:17px}}

<body>

<section class="hero"><h1>Et si…</h1><p>Change une seule chose dans la réalité. Puis découvre la vie, les événements et les choix qui pourraient en découler.</p></section>
<section class="box">

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)}, promptEl=$('prompt'), workspace=$('workspace'), status=$('status'), progress=$('progress');
var mode='long',current=null,busy=false,KEY='etsi_histories_v5';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(t){var e=$('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(function(){e.classList.add('hidden')},2200)}
function all(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function write(a){localStorage.setItem(KEY,JSON.stringify(a))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function subject(q){return q.replace(/^(et si|imagine|imaginons|supposons que|que se passerait-il si)\s*/i,'').replace(/[?.!]+$/,'').trim()}
function classify(q){var x=q.toLowerCase();if(/beyonc|taylor swift|rihanna|drake|messi|ronaldo|acteur|actrice|chanteur|chanteuse|célébrit|celebrite|star/.test(x))return'person';if(/humain|humanité|humanite|disparaî|disparai|sans humains|plus personne/.test(x))return'extinction';if(/napoléon|napoleon|waterloo|rome|empire|roi |reine |guerre|hitler|histoire/.test(x))return'history';if(/internet|intelligence artificielle|robot|ordinateur|smartphone|technologie|machine/.test(x))return'tech';if(/lune|mars|jupiter|gravité|gravite|planète|planete|soleil|espace|alien|univers/.test(x))return'science';if(/climat|pollution|forêt|foret|abeille|animal|océan|ocean|espèce|espece|écologie|ecologie/.test(x))return'eco';if(/argent|million|milliard|entreprise|commerce|marché|marche|invest|banque|économie|economie|business/.test(x))return'economy';if(/président|president|gouvernement|ville|population|école|ecole|société|societe|pays|nation|loi/.test(x))return'society';if(/je |moi |ma vie|ma carrière|ma carriere|si j|devenais|vivais|partais|déménage|demenage/.test(x))return'life';return'general'}
var labels={person:'Réalité alternative',extinction:'Fin de l’humanité',history:'Histoire alternative',tech:'Réalité technologique',science:'Monde hypothétique',eco:'Réalité écologique',economy:'Trajectoire économique',society:'Monde alternatif',life:'Vie alternative',general:'Réalité alternative'};
function makeStory(q){var s=subject(q),t=classify(q),b=isFinite(q.length)?q.length:0,isB=/beyonc/i.test(q),isGone=/humain|humanité|dispara/i.test(q),isNap=/napoléon|napoleon|waterloo/i.test(q),isNet=/internet/i.test(q),isMoon=/lune/i.test(q);var title=isB?'Beyoncé — une autre vie':isGone?'Le monde après les humains':isNap?'Waterloo — l’autre victoire':isNet?'Le jour où Internet s’est tu':isMoon?'La deuxième lune':'Une réalité qui n’existait pas';var C=[];
function add(h,a){C.push([h,a])}
if(isB){add('PROLOGUE — AVANT LA LÉGENDE',[`Houston, au début des années 1980. Dans cette réalité, ${s} commence sa vie dans un environnement différent de celui que nous connaissons. Pour l'instant, rien ne ressemble à une légende. Il y a une maison, une famille, des conversations ordinaires et cette sensation que l'avenir est encore complètement vide.`,`La différence ne se résume pas à une apparence. Elle change les regards, certaines rencontres et peut-être quelques portes. Mais une chose reste : une enfant qui aime la musique et qui découvre qu'une scène peut transformer une pièce entière.`,`À l'école, personne ne sait encore son nom. Un professeur remarque son rythme. Un autre adulte lui conseille de chanter davantage. Ce sont de petits moments. Dans cette réalité, ils vont s'additionner.`]);add('CHAPITRE I — LA PREMIÈRE SCÈNE',[`Le soir où elle monte sur scène pour la première fois, la salle n'est pas pleine. Quelques personnes parlent encore entre elles. Puis la musique commence. Elle oublie presque immédiatement les visages autour d'elle.`,`Après le dernier accord, le silence dure une seconde de trop. Puis quelqu'un applaudit. Un deuxième suit. Et soudain la salle entière réagit. Ce n'est pas encore la gloire. C'est seulement la première preuve qu'une autre vie est possible.`,`Son entourage comprend qu'il faudra choisir. Continuer comme avant, avec une enfance normale, ou prendre cette chance au sérieux. La décision paraît minuscule. Elle ne l'est pas.`]);add('CHAPITRE II — LA PORTE QUI S’OUVRE',[`À l'adolescence, une rencontre change la trajectoire. Un producteur entend sa voix. Il ne promet rien. Il demande une deuxième audition. Elle accepte.`,`Les semaines suivantes sont difficiles : travailler, apprendre, recommencer, supporter les refus. Une carrière n'arrive pas d'un seul coup. Elle se construit dans des pièces trop petites, des trajets trop longs et des soirées où personne ne connaît encore son nom.`,`Puis un morceau fonctionne. Pas parfaitement. Juste assez pour attirer l'attention. La vie privée commence à se mélanger à la vie publique.`]);add('CHAPITRE III — LE TOURNANT',[`À vingt ans, une proposition pourrait changer sa carrière. Elle doit choisir entre une sécurité confortable et une aventure risquée.`,`Elle choisit le risque. Le disque sort. Les premières semaines sont étranges : certains l'adorent, d'autres la rejettent. Puis les concerts commencent à remplir les salles.`,`Un soir, juste avant de monter sur scène, elle comprend quelque chose : elle n'essaie plus de devenir célèbre. Elle est devenue quelqu'un dont les décisions seront observées par des millions de personnes.`]);add('CHAPITRE IV — LE PRIX DE LA CÉLÉBRITÉ',[`La réussite apporte des problèmes nouveaux. Les contrats deviennent plus gros. Les journées deviennent plus courtes. Chaque chanson et chaque relation peut devenir une conversation publique.`,`Elle commence à protéger certaines parties de sa vie. Les personnes présentes depuis le début restent proches. D'autres disparaissent dès que l'intérêt commercial diminue.`,`Dans cette réalité, la question revient : aurait-elle eu la même carrière dans notre monde ? Impossible de le savoir. Une vie n'est pas une expérience de laboratoire.`]);add('CHAPITRE V — LE CHOIX IMPOSSIBLE',[`Au sommet, une occasion arrive. Elle pourrait accepter le projet le plus lucratif de sa vie, ou prendre plusieurs années pour créer quelque chose de personnel.`,`Elle hésite. Les chiffres poussent vers la sécurité. L'intuition pousse ailleurs. Elle choisit la seconde voie.`,`Quelques mois plus tard, certains pensent qu'elle a disparu. En réalité, elle prépare l'œuvre qui définira cette version de sa vie.`]);add('ÉPILOGUE — UNE AUTRE LÉGENDE',[`Des années passent. Les chansons changent, les scènes deviennent immenses et son nom traverse les générations. Pourtant, le détail le plus important n'est pas seulement la divergence de départ. C'est la somme des personnes rencontrées ensuite.`,`Une naissance différente peut changer une vie, mais aussi une rencontre à douze ans, une décision à dix-neuf ans ou un refus à trente ans. C'est cela qui rend cette histoire imprévisible.`,`Quand elle regarde derrière elle, elle ne voit pas une ligne droite. Elle voit des dizaines de routes qu'elle aurait pu prendre.`])}
else if(isGone){add('PROLOGUE — LE DERNIER JOUR',[`Le dernier jour de l'humanité ne ressemble pas à un film catastrophe. Il n'y a pas forcément de ciel rouge. Dans des milliers de villes, les lumières fonctionnent encore. Des voitures sont garées. Des téléphones attendent des appels qui ne viendront jamais.`,`Puis le silence devient la seule chose commune à toutes les villes. Plus personne ne répond. Plus personne ne prend le volant. Plus personne ne rentre chez lui.`,`La planète, elle, continue.`]);add('CHAPITRE I — 24 HEURES',[`Les premières heures sont presque banales. Les systèmes automatisés poursuivent leur travail. Certaines centrales produisent encore.`,`Mais un monde humain dépend d'une quantité immense de gestes humains. Quelqu'un doit surveiller, réparer, ravitailler. Quand ces gestes cessent, les premières ruptures commencent.`,`La nuit tombe. Pour la première fois depuis des siècles, des milliards de fenêtres restent éteintes sans qu'aucun humain ne se demande pourquoi.`]);add('CHAPITRE II — LES PREMIÈRES SEMAINES',[`Les réseaux électriques se fragmentent. Dans certains endroits, l'eau continue de couler. Ailleurs, les pompes s'arrêtent. Les ascenseurs deviennent des boîtes immobiles.`,`Les animaux domestiques restent près des lieux qu'ils connaissent. Certains trouvent de la nourriture. D'autres disparaissent. Les espèces sauvages explorent des endroits interdits.`,`Une ville peut sembler intacte pendant des mois tout en étant déjà morte.`]);add('CHAPITRE III — UN AN',[`Après un an, les routes changent. Les fissures dans l'asphalte deviennent des refuges pour les plantes. L'eau s'infiltre dans les bâtiments.`,`Dans les campagnes, certaines espèces reviennent. Il n'y a pas de nouveau gouvernement de la nature. Il n'y a simplement plus personne pour lui interdire certaines choses.`,`Le monde n'est pas devenu paisible. Il est devenu indifférent à l'absence de l'homme.`]);add('CHAPITRE IV — CINQUANTE ANS',[`Les bâtiments les plus fragiles sont méconnaissables. Les arbres occupent des rues. Des ponts se sont effondrés.`,`Une autoroute devient une longue clairière. Une statue devient une pierre couverte de mousse.`,`Quelqu'un né ici ne comprendrait pas immédiatement à quoi servaient toutes ces lignes droites qui traversaient les forêts.`]);add('CHAPITRE V — DEUX SIÈCLES',[`Deux cents ans plus tard, la planète ne ressemble plus à celle que les humains connaissaient. Certaines structures monumentales subsistent. Beaucoup d'autres ont disparu.`,`Les océans ont repris une partie de ce que nous leur avions pris. Les villes côtières sont particulièrement vulnérables.`,`La dernière partie de notre civilisation à disparaître n'est peut-être pas un bâtiment. C'est une histoire.`]);add('ÉPILOGUE — APRÈS NOUS',[`Un millier d'années passent. La Terre n'est pas devenue parfaite. Elle a simplement continué sans nous.`,`Il reste des fragments : verre, béton, métaux, traces enfouies. À l'échelle de la planète, notre civilisation n'était qu'un chapitre.`,`Le vent traverse les arbres sans rencontrer une seule fenêtre éclairée.`])}
else if(isNap){add('PROLOGUE — WATERLOO',[`18 juin 1815. La pluie transforme le terrain en boue. Dans notre histoire, cette journée se termine par la défaite de Napoléon. Ici, une décision différente déplace toute l'Europe.`,`Un ordre arrive plus tôt. Une unité avance. Une brèche apparaît. Au départ, personne ne comprend qu'il vient de se produire quelque chose d'irréversible.`,`À la tombée de la nuit, la bataille n'a pas suivi le scénario que les généraux connaissaient.`]);add('CHAPITRE I — LA NOUVELLE',[`La nouvelle met du temps à arriver. Quand elle arrive, elle semble incroyable : Napoléon a gagné. À Londres, Paris, Vienne et Berlin, les gouvernements recalculent leurs plans.`,`Une victoire ne suffit pas à reconstruire un empire. Napoléon doit décider quoi faire de cette victoire : punir, négocier ou avancer.`,`Chaque option possède un prix.`]);add('CHAPITRE II — L’EUROPE SOUS PRESSION',[`Les diplomates travaillent jour et nuit. Certains veulent la paix. D'autres comprennent qu'une victoire française peut devenir le début d'une guerre plus grande.`,`Dans les villes, les gens ne voient pas les cartes des généraux. Ils voient les soldats, les prix et les familles séparées.`,`L'Europe entre dans une période où une signature peut changer le destin de millions de personnes.`]);add('CHAPITRE III — LE MONDE D’APRÈS',[`Les années suivantes ne ressemblent pas simplement à notre XIXe siècle avec quelques frontières déplacées. Les alliances changent, les investissements changent et certaines révolutions prennent d'autres formes.`,`Napoléon vieillit. La question devient urgente : que se passera-t-il après lui ?`,`Une grande victoire résout une journée et peut créer des décennies de nouvelles questions.`]);add('ÉPILOGUE',[`Un siècle plus tard, les historiens débattent encore de Waterloo. Les frontières ont un autre dessin. Les noms sont parfois les mêmes, mais les souvenirs sont différents.`,`Tout a commencé par quelques heures sur un champ détrempé.`])}
else if(isNet){add('PROLOGUE — 08:00',[`À huit heures, Internet fonctionne. À huit heures une minute, il disparaît. Les téléphones sont toujours dans les mains des gens. Les ordinateurs sont toujours allumés. Mais les connexions ne répondent plus.`,`Au début, beaucoup pensent à une panne. Puis les minutes deviennent des heures.`,`Les choses deviennent sérieuses lorsque les systèmes qui dépendaient du réseau commencent eux aussi à changer.`]);add('CHAPITRE I — LE PREMIER JOUR',[`Les entreprises tentent de revenir à des procédures anciennes. Des files apparaissent. Des gens ressortent des carnets et des numéros de téléphone qu'ils n'utilisaient plus.`,`Le plus étrange n'est pas la technologie qui disparaît. C'est la vitesse à laquelle les habitudes disparaissent avec elle.`,`Le soir, des millions de personnes comprennent qu'elles ne savent plus comment contacter certaines personnes sans Internet.`]);add('CHAPITRE II — LA PREMIÈRE SEMAINE',[`Les banques, les commerces et les administrations réorganisent leurs activités. Certaines fonctions continuent localement. D'autres ralentissent.`,`Les entreprises numériques improvisent. De petites structures autrefois considérées comme dépassées deviennent précieuses parce qu'elles savent travailler hors ligne.`,`La société ne revient pas au passé. Elle invente un nouveau présent à partir de morceaux du passé.`]);add('CHAPITRE III — UN AN',[`Un an plus tard, les gens ont appris à vivre autrement. Les informations circulent par des réseaux locaux, la radio, les journaux et des systèmes nouveaux.`,`Une génération qui avait grandi avec Internet découvre l'attente.`,`Et l'attente change aussi la manière dont les gens se parlent.`]);add('ÉPILOGUE',[`Des années plus tard, un réseau différent apparaît. Il est moins centralisé et plus lent, mais conçu avec une obsession nouvelle : ne plus jamais dépendre d'un seul système mondial.`,`Le monde n'a pas seulement perdu Internet. Il a appris ce qu'Internet avait réellement changé.`])}
else{var base=s||'cette idée';add('PROLOGUE — LE POINT DE DÉPART',[`Tout commence par une phrase qui paraît simple : « ${base}. » Dans notre réalité, cette chose n'existe pas exactement de cette manière. Pour explorer cette possibilité, une seule règle compte : une modification peut déplacer une vie entière.`,`Au début, presque rien ne semble différent. C'est justement ce qui rend le changement fascinant. Les premières conséquences apparaissent souvent dans des endroits auxquels personne ne pense.`,`Quelqu'un prend une décision. Quelqu'un d'autre remarque quelque chose. Une porte s'ouvre.`]);add('CHAPITRE I — LE PREMIER ÉCART',[`Le premier jour passe. Puis le deuxième. Les personnes concernées s'adaptent. Certaines profitent de la nouvelle situation. D'autres la regrettent.`,`Dans une autre pièce, quelqu'un fait un choix insignifiant. Quelques mois plus tard, ce choix devient important.`,`La nouvelle réalité commence à avoir sa propre logique.`]);add('CHAPITRE II — LES CONSÉQUENCES',[`Ce qui semblait être un petit changement touche d'autres domaines. Les habitudes évoluent, les relations se déplacent et les opportunités changent de main.`,`Une personne qui aurait normalement été au centre de l'histoire ne l'est plus. Une autre, presque inconnue, devient indispensable.`,`Une réalité alternative ne change pas seulement le résultat. Elle change les personnes qui ont la possibilité d'agir.`]);add('CHAPITRE III — LE TOURNANT',[`Puis arrive le moment que personne n'avait prévu. Un événement oblige les personnages à choisir. Continuer comme avant est devenu impossible.`,`Le choix est difficile parce qu'aucune réponse n'est parfaite. Une décision protège une chose et en détruit une autre.`,`La décision est prise. À partir de cet instant, cette histoire ne peut plus revenir exactement en arrière.`]);add('CHAPITRE IV — LE MONDE S’ADAPTE',[`Les mois deviennent des années. Ce qui semblait étrange devient normal. Les enfants grandissent dans cette réalité sans connaître l'ancienne.`,`Les adultes, eux, se souviennent du moment où tout a changé. Certains regrettent l'ancien monde. D'autres pensent qu'il était temps qu'il disparaisse.`,`Une réalité alternative n'est pas seulement une suite d'événements. C'est une nouvelle normalité.`]);add('CHAPITRE V — DES ANNÉES PLUS TARD',[`Des années passent. Les conséquences initiales sont difficiles à distinguer des décisions prises ensuite.`,`Une nouvelle génération demande pourquoi les choses sont ainsi. Les réponses deviennent des histoires, puis des traditions.`,`Et quelque part, une personne qui n'existerait pas dans notre réalité prend une décision qui changera la suite.`]);add('ÉPILOGUE — L’AUTRE CHEMIN',[`Avec le recul, tout paraît évident. Pourtant rien ne l'était. Cette réalité aurait pu suivre dix autres directions.`,`C'est ce qui rend le « et si » fascinant : on ne remplace pas seulement un fait. On crée un monde dans lequel les gens doivent ensuite vivre avec les conséquences.`,`Et cette histoire pourrait continuer.`])}
if(mode==='quick')C=C.slice(0,3);if(mode==='long')C=C.slice(0,6);if(mode==='film')C=C.slice(0,7);if(mode==='epic')C=C.concat([['CHAPITRE BONUS — UNE AUTRE DÉCISION',[`Imagine qu'un détail change encore. Une rencontre n'a pas lieu. Une personne répond oui au lieu de non. Une découverte arrive plus tôt.`,`Le monde ne s'effondre pas forcément. Il se déplace. Et ce déplacement crée une nouvelle histoire à l'intérieur de la première.`]],['ÉPILOGUE ÉTENDU — CE QUI RESTE',[`À la fin, il ne reste pas une équation. Il reste des souvenirs, des conséquences et des gens qui ont vécu dans un monde légèrement différent du nôtre.`,`La question n'est plus seulement « que se serait-il passé ? ». Elle devient : « qui serais-je devenu dans ce monde ? »`]]);return{id:uid(),query:q,title:title,type:t,mode:mode,created:new Date().toISOString(),chapters:C,branch:'Originale'} }
function render(story){current=story;var html='<div class="cover"><div class="kicker">'+esc(labels[story.type])+'</div><h2>'+esc(story.title)+'</h2><p><strong>Hypothèse :</strong> '+esc(story.query)+'</p><div class="tags"><span class="tag">'+esc(story.mode)+'</span><span class="tag">Fiction</span><span class="tag">'+esc(story.branch)+'</span></div><div class="actions"><button type="button" class="btn primary" id="saveBtn">Enregistrer</button><button type="button" class="btn" id="copyBtn">Copier</button><button type="button" class="btn" id="shareBtn">Partager</button><button type="button" class="btn" id="printBtn">Imprimer</button><button type="button" class="btn" id="branchBtn">Nouvelle branche</button></div></div>';for(var i=0;i<story.chapters.length;i++){var c=story.chapters[i];html+='<article class="chapter"><h3>'+esc(c[0])+'</h3>';for(var j=0;j<c[1].length;j++){html+='<p>'+esc(c[1][j])+'</p>';if(j===1&&c[1].length>2)html+='<div class="scene">Et pendant que cette nouvelle réalité commence à s’écrire, personne ne sait encore jusqu’où elle ira.</div>'}html+='</article>'}html+='<div class="choices"><h4>Tu veux continuer ?</h4><button type="button" class="btn" id="choiceA">A — Continue cette trajectoire</button><button type="button" class="btn" id="choiceB">B — Un événement inattendu change tout</button><button type="button" class="btn" id="choiceCustom">✍ Écrire ma propre décision</button></div>';workspace.innerHTML=html;bindStory();window.scrollTo({top:workspace.offsetTop-10,behavior:'smooth'})}
function bindStory(){
$('saveBtn').onclick=function(){var a=all().filter(function(x){return x.id!==current.id});a.unshift(current);write(a);toast('Histoire enregistrée')};
$('copyBtn').onclick=function(){var text=current.title+'\n\n'+current.chapters.map(function(c){return c[0]+'\n\n'+c[1].join('\n\n')}).join('\n\n');if(navigator.clipboard){navigator.clipboard.writeText(text).then(function(){toast('Histoire copiée')}).catch(function(){toast('Copie impossible')})}else{var t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('Histoire copiée')}};
$('shareBtn').onclick=function(){share(current.title+' — '+current.query)};$('printBtn').onclick=function(){window.print()};
$('branchBtn').onclick=function(){var n=JSON.parse(JSON.stringify(current));n.id=uid();n.branch='Alternative';n.chapters.push(['BRANCHE ALTERNATIVE',[`Cette fois, un détail qui semblait secondaire prend une autre direction. Une personne répond différemment et la suite change.`,`Le monde garde une partie de ce qui vient d'être raconté, mais il n'est plus exactement le même.`,`À partir de maintenant, cette branche possède sa propre histoire.`]]);render(n)};
$('choiceA').onclick=function(){continueStory('La trajectoire continue')};$('choiceB').onclick=function(){continueStory('Un événement inattendu change tout')};$('choiceCustom').onclick=function(){var x=prompt('Que veux-tu faire dans cette réalité ?');if(x)continueStory(x)}
}
function continueStory(decision){var n=JSON.parse(JSON.stringify(current));n.id=uid();n.chapters.push(['CHAPITRE SUIVANT — '+decision,[`La décision est prise : ${decision}. Pendant quelques secondes, rien ne semble différent. Puis les premières conséquences apparaissent.`,`Ce qui était prévu ne disparaît pas complètement. Cela se mélange avec la nouvelle décision. Une relation change, une occasion apparaît ou un problème devient impossible à ignorer.`,`La suite appartient désormais à cette trajectoire.`]]);render(n)}
function share(text){if(navigator.share){navigator.share({title:'Et si ?',text:text,url:location.href}).catch(function(){})}else if(navigator.clipboard){navigator.clipboard.writeText(text+'\n'+location.href).then(function(){toast('Partage copié')})}else toast('Partage non disponible')}
$('go').onclick=function(){if(busy)return;var q=promptEl.value.trim();if(!q){toast('Écris d’abord une idée');promptEl.focus();return}busy=true;status.textContent='Construction…';progress.style.width='20%';workspace.innerHTML='<div class="empty">Je construis ta réalité alternative…</div>';setTimeout(function(){progress.style.width='55%';status.textContent='Écriture…'},250);setTimeout(function(){var s=makeStory(q);progress.style.width='100%';render(s);status.textContent='Terminé';busy=false;setTimeout(function(){progress.style.width='0'},700)},650)};
Array.prototype.forEach.call(document.querySelectorAll('.mode'),function(b){b.onclick=function(){if(busy)return;mode=b.getAttribute('data-mode');Array.prototype.forEach.call(document.querySelectorAll('.mode'),function(x){x.classList.remove('active')});b.classList.add('active');status.textContent='Mode '+b.textContent}});
Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(b){b.onclick=function(){promptEl.value=b.textContent;promptEl.focus()}});
$('newBtn').onclick=function(){current=null;promptEl.value='';workspace.innerHTML='<div class="empty">Nouvelle histoire prête.<br>Écris ton idée.</div>';status.textContent='Prêt';progress.style.width='0';promptEl.focus()};promptEl.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='Enter')$('go').click()});
$('historyBtn').onclick=function(){renderHistory();$('side').classList.remove('hidden')};$('closeSide').onclick=function(){$('side').classList.add('hidden')};
function renderHistory(){var list=$('savedList'),a=all();if(!a.length){list.innerHTML='<p style="color:var(--muted)">Aucune histoire enregistrée.</p>';return}list.innerHTML=a.map(function(x){return '<div class="saved"><b>'+esc(x.title)+'</b><small>'+esc(x.query)+'</small><div class="row"><button type="button" class="btn openSaved" data-id="'+esc(x.id)+'">Ouvrir</button><button type="button" class="btn danger deleteSaved" data-id="'+esc(x.id)+'">Supprimer</button></div></div>'}).join('');Array.prototype.forEach.call(document.querySelectorAll('.openSaved'),function(b){b.onclick=function(){var x=all().find(function(z){return z.id===b.getAttribute('data-id')});if(x){render(x);$('side').classList.add('hidden')}}});Array.prototype.forEach.call(document.querySelectorAll('.deleteSaved'),function(b){b.onclick=function(){write(all().filter(function(x){return x.id!==b.getAttribute('data-id')}));renderHistory();toast('Histoire supprimée')}})}
$('deleteAll').onclick=function(){if(confirm('Supprimer toutes les histoires enregistrées ?')){localStorage.removeItem(KEY);renderHistory();toast('Toutes les histoires ont été supprimées')}};
$('shareApp').onclick=function(){share('Découvre Et si ? — imagine une autre réalité et vis son histoire.')};$('helpBtn').onclick=function(){alert('Écris n’importe quelle idée, choisis un mode puis clique sur Commencer. Après l’histoire : enregistre, copie, partage, imprime ou crée une autre trajectoire. Les histoires enregistrées sont accessibles dans Mes histoires.')};
})();
</script>
