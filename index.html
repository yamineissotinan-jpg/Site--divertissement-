<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Et si ? — réalités alternatives</title><style>*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#f4f0e8;font-family:Inter,system-ui,sans-serif}.app{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;letter-spacing:.18em;color:#e8bd61}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #303746;background:#111722;color:#eee;border-radius:11px;padding:10px 14px;cursor:pointer}.btn:hover{border-color:#e8bd61}.primary{background:#e8bd61;color:#111;font-weight:900}.hero{text-align:center;padding:45px 10px 25px}.hero h1{font:900 clamp(60px,12vw,120px)/.85 Georgia;margin:0}.hero p{color:#aab1bd;font-size:18px}.composer{background:#10151e;border:1px solid #2d3542;border-radius:22px;padding:18px}.prompt{width:100%;min-height:145px;background:#080b11;color:#fff;border:1px solid #353e4b;border-radius:15px;padding:16px;font:19px/1.5 Georgia;resize:vertical}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.mode.active{border-color:#e8bd61;color:#e8bd61}.status{margin-left:auto;color:#9ba4b1}.examples{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid #303746;background:#0e131c;color:#ddd;border-radius:99px;padding:9px 12px;cursor:pointer}.workspace{margin-top:22px}.story{background:#10151e;border:1px solid #2d3542;border-radius:22px;overflow:hidden}.head{padding:28px}.tag{font-size:12px;font-weight:900;letter-spacing:.15em;color:#e8bd61}.story h2{font:800 clamp(34px,6vw,62px)/1.05 Georgia;margin:9px 0}.intro{color:#aab1bd;line-height:1.7}.page{min-height:900px;padding:55px 8%;border-top:1px solid #2b3340;page-break-after:always}.page h3{font:800 30px Georgia;margin:0 0 25px}.para{font:18px/1.9 Georgia;color:#e9e4da;margin:0 0 14px}.scene{font:20px/1.8 Georgia;border-left:3px solid #e8bd61;padding-left:15px;margin:18px 0}.toolbar{padding:18px;border-top:1px solid #2b3340;display:flex;gap:8px;flex-wrap:wrap}.drawer{position:fixed;right:14px;top:14px;width:min(430px,calc(100% - 28px));max-height:92vh;overflow:auto;background:#0c1119;border:1px solid #394252;border-radius:18px;padding:18px;z-index:20;box-shadow:0 20px 80px #000}.hidden{display:none}.save{border:1px solid #303746;border-radius:12px;padding:12px;margin:8px 0}.save button{margin:5px 5px 0 0}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#f4f0e8;color:#111;padding:10px 15px;border-radius:10px;font-weight:800;z-index:30}.bar{height:4px;background:#1d2530;margin-top:12px;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#e8bd61;transition:.3s}.choice{border:1px solid #343d4c;background:#0b1018;border-radius:14px;padding:14px;margin:8px 0;cursor:pointer}.choice:hover{border-color:#e8bd61}@media(max-width:650px){.page{padding:35px 5%}.para{font-size:17px}.status{width:100%;margin-left:0}}@media print{body{background:white;color:black}.top,.composer,.examples,.toolbar,.drawer{display:none}.story{border:0}.page{min-height:auto;color:black}.para{color:black}}</style></head><body><div class="app"><header class="top"><div class="logo">ET SI ?</div><nav class="nav"><button class="btn" id="history">Mes histoires</button><button class="btn" id="help">Aide</button></nav></header><section class="hero"><h1>Et si…</h1><p>Une idée. Une réalité de départ. Puis une autre vie.</p></section><section class="composer"><textarea id="prompt" class="prompt" placeholder="Et si Beyoncé était blanche ?&#10;Et si Napoléon avait gagné Waterloo ?&#10;Et si les humains disparaissaient aujourd'hui ?&#10;Et si Internet n'avait jamais existé ?"></textarea><div class="row"><button class="btn primary" id="go">▶ Commencer</button><button class="btn mode active" data-mode="Long">Long</button><button class="btn mode" data-mode="Épique">Épique</button><button class="btn mode" data-mode="Film">Film</button><button class="btn" id="new">Nouvelle</button><span class="status" id="status">Prêt</span></div><div class="bar"><i id="bar"></i></div></section><div class="examples" id="examples"><button class="chip">Et si Beyoncé était blanche ?</button><button class="chip">Et si les humains disparaissaient ?</button><button class="chip">Et si Internet disparaissait demain ?</button><button class="chip">Et si Napoléon gagnait Waterloo ?</button><button class="chip">Et si la Terre avait deux lunes ?</button><button class="chip">Et si je devenais milliardaire à 18 ans ?</button></div><section id="workspace" class="workspace"><div class="story"><div class="head"><div class="tag">RÉALITÉ ALTERNATIVE</div><h2>Ton histoire commence ici</h2><p class="intro">Écris ton idée. Le moteur distingue le sujet, l'intention et le point de divergence avant de construire le récit.</p></div></div></section></div><aside id="drawer" class="drawer hidden"><div class="row" style="justify-content:space-between;margin:0"><h3>Mes histoires</h3><button class="btn" id="close">Fermer</button></div><div id="saved"></div><button class="btn" id="clear">Supprimer tout</button></aside><div id="toast" class="toast hidden"></div><script>(()=>{const $=x=>document.getElementById(x),p=$('prompt'),w=$('workspace'),st=$('status'),bar=$('bar');let mode='Long',current=null;const KEY='etsi_v10';const esc=s=>{let d=document.createElement('div');d.textContent=s;return d.innerHTML};const toast=t=>{let x=$('toast');x.textContent=t;x.classList.remove('hidden');clearTimeout(x.t);x.t=setTimeout(()=>x.classList.add('hidden'),1800)};const db=()=>JSON.parse(localStorage.getItem(KEY)||'[]');const put=a=>localStorage.setItem(KEY,JSON.stringify(a));
function intent(q){let s=q.toLowerCase();let alt=/\bet si\b|imagine si|dans une réalité|aurait été|aurait gagné|n'avait jamais|disparaissait|devenait/.test(s);let asks=/pourquoi|comment|qu'est-ce|quelle est|raconte l'histoire|explique|définis/.test(s);let type=/beyonc|musk|elon|acteur|actrice|chanteur|chanteuse|président|personne|célébrit/.test(s)?'personne':/napoléon|napoleon|waterloo|rome|guerre|empire|roi|reine|révolution/.test(s)?'histoire':/internet|ordinateur|robot|technolog|ia |intelligence artificielle/.test(s)?'technologie':/lune|mars|planète|gravité|soleil|espace/.test(s)?'science':/humain|humanité|population|civilisation|société|pays|ville/.test(s)?'société':/argent|milliard|million|entreprise|marché|économie|commerce/.test(s)?'économie':'général';return{alt,asks,type,subject:q.replace(/^et si\s*/i,'').replace(/[?!]/g,'').trim()}}
async function research(q){let term=q.replace(/^et si\s*/i,'').replace(/[?!]/g,'').trim();let urls=[`https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(term)}`,`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(term)}`];for(let u of urls){try{let r=await fetch(u,{headers:{Accept:'application/json'}});if(r.ok){let j=await r.json();if(j.extract)return{title:j.title||term,extract:j.extract,url:j.content_urls?.desktop?.page||u}}}catch(e){}}return null}
const banks={personne:['Dans cette autre vie, le premier détail différent apparaît bien avant la célébrité.','La maison n’a rien de spectaculaire, mais les habitudes de cette famille vont compter énormément.','Un parent remarque quelque chose que les autres prennent pour un simple jeu.','À l’école, une rencontre semble banale et pourtant elle restera longtemps dans sa mémoire.','Les années passent, et le personnage apprend à observer les adultes avant de comprendre leurs contradictions.','Un soir, une conversation familiale ouvre une possibilité que personne n’avait envisagée.','La première occasion arrive plus tôt que prévu.','Elle aurait pu passer sans laisser de trace, mais quelqu’un décide de dire oui.','Le succès ne vient pas d’un seul coup.','Il arrive par petites victoires, par erreurs et par rencontres.','Une personne nouvelle entre alors dans sa vie.','Cette relation devient importante parce qu’elle apporte autant de problèmes que de solutions.','Le personnage découvre que son image publique ne ressemble pas toujours à sa vie privée.','Une décision prise dans la précipitation change une relation professionnelle.','Le lendemain, les conséquences sont déjà visibles.','Les journaux racontent une version simple de l’événement.','La réalité intime est beaucoup plus compliquée.','Une opportunité internationale arrive au moment où tout semble fragile.','Partir signifie abandonner certaines habitudes.','Rester signifie peut-être perdre une chance unique.'],histoire:['Le point de divergence paraît minuscule lorsqu’il se produit.','Personne ne sait encore qu’il va modifier plusieurs générations.','Les premières dépêches donnent une image confuse de la situation.','Les dirigeants disposent de quelques heures pour choisir leur réponse.','Un acteur secondaire comprend avant les autres ce qui est en train de se passer.','Une alliance qui semblait solide commence à se fissurer.','Dans les rues, les habitants ne connaissent qu’une partie de l’histoire.','Les soldats, eux, voient immédiatement que les plans ont changé.','Une décision politique transforme la victoire en problème.','Les opposants cherchent un nouveau symbole.','Les frontières commencent à prendre une autre signification.','Des familles ordinaires vivent les conséquences sans connaître les causes.','Les années suivantes ne ressemblent plus à celles de notre réalité.','Une génération grandit avec d’autres héros.','Les écoles enseignent une autre chronologie.','Les cartes sont redessinées.','Les intérêts économiques suivent les nouveaux rapports de force.','Une crise finit par révéler les faiblesses du nouvel ordre.','Un personnage oublié devient soudain essentiel.','La paix, lorsqu’elle arrive, n’est pas la paix que tout le monde espérait.'],société:['La première journée paraît presque normale.','Quelques personnes remarquent pourtant une anomalie.','La nouvelle circule d’abord entre proches.','Puis elle atteint les quartiers voisins.','Les téléphones deviennent silencieux ou saturés selon les endroits.','Les familles se réunissent pour décider quoi faire.','Les autorités publient un premier message prudent.','Personne ne sait encore si ce message rassure ou inquiète.','Des gens improvisent des solutions.','Certaines fonctionnent étonnamment bien.','D’autres créent de nouveaux problèmes.','Une petite entreprise découvre qu’elle possède une ressource devenue essentielle.','Une personne inconnue devient soudain indispensable.','Les habitudes changent lentement.','Les enfants s’adaptent plus vite que les adultes.','Les anciens regrettent le monde précédent.','Une nouvelle économie apparaît.','Les règles sociales changent avec elle.','Un conflit éclate là où personne ne l’attendait.','Une réconciliation inattendue modifie ensuite la trajectoire.'],technologie:['Au départ, presque personne ne remarque le changement.','Un appareil fonctionne différemment.','Un service devient indisponible.','Une équipe technique cherche une explication.','Les premières hypothèses sont contradictoires.','Une entreprise comprend qu’elle doit agir avant ses concurrents.','Les utilisateurs commencent à inventer leurs propres solutions.','Un marché entier change en quelques semaines.','Les gouvernements découvrent qu’ils dépendent eux aussi de cette technologie.','Une génération apprend à vivre avec de nouvelles règles.','Un ingénieur fait une découverte inattendue.','Cette découverte ouvre une possibilité que personne n’avait prévue.','Une erreur humaine transforme ensuite cette possibilité en crise.','Le public réclame des réponses.','Les dirigeants doivent choisir entre vitesse et prudence.','Le choix paraît technique mais ses conséquences deviennent sociales.','De nouvelles professions apparaissent.','D’anciennes disparaissent.','Les relations humaines changent progressivement.','Après plusieurs années, le monde ne ressemble plus au monde de départ.'],science:['Le changement commence par une seule variable.','Au début, les instruments ne montrent presque rien.','Puis une mesure ne correspond plus aux prévisions.','Les chercheurs vérifient leurs calculs.','La deuxième mesure confirme pourtant la première.','Les laboratoires se mettent à comparer leurs résultats.','Une explication gagne du terrain.','Une autre paraît plus audacieuse mais finit par devenir crédible.','Les conséquences physiques restent d’abord invisibles au grand public.','Puis elles atteignent un lieu où vivent des millions de personnes.','Les autorités doivent apprendre à décider avec des informations incomplètes.','Les scientifiques découvrent une seconde conséquence.','Elle était impossible à voir au début.','Les assurances, les entreprises et les familles réagissent à leur tour.','Une technologie nouvelle devient nécessaire.','Son développement provoque une nouvelle série de choix.','Certains pays coopèrent.','D’autres préfèrent agir seuls.','Une découverte finale change la compréhension du phénomène.','Le monde apprend à vivre avec cette nouvelle réalité.'],economie:['Le marché ne réagit pas immédiatement.','Quelques investisseurs remarquent une anomalie.','Une entreprise prend une décision risquée.','Son concurrent hésite.','Les consommateurs commencent ensuite à changer leurs habitudes.','Une pénurie apparaît dans un endroit inattendu.','Les prix bougent.','Les familles modifient leurs dépenses.','Les entrepreneurs voient de nouvelles opportunités.','Certains s’enrichissent rapidement.','D’autres perdent presque tout.','Un gouvernement annonce une mesure exceptionnelle.','Les entreprises adaptent leurs stratégies.','Un nouveau secteur apparaît.','Les banques doivent réévaluer certains risques.','Une crise locale devient internationale.','Une petite décision prise des années plus tôt revient dans l’actualité.','Les gagnants découvrent qu’ils doivent maintenant gérer leur propre succès.','Les perdants cherchent une seconde chance.','Le système économique finit par trouver un nouvel équilibre.'],général:['Tout commence par une différence que presque personne ne remarque.','La journée continue comme d’habitude.','Un personnage fait pourtant un choix légèrement différent.','Ce choix entraîne une conséquence inattendue.','Quelqu’un d’autre réagit.','La réaction modifie encore la situation.','Une rencontre devient importante.','Une porte s’ouvre.','Une autre se ferme.','Le personnage hésite.','Puis il avance malgré tout.','Le monde autour de lui commence à changer.','Les proches comprennent qu’il ne s’agit plus d’un simple accident.','Une nouvelle possibilité apparaît.','Elle comporte un prix.','Le personnage accepte de le payer.','Cette décision provoque un conflit.','Le conflit révèle une vérité cachée.','Une personne inattendue intervient.','La suite devient impossible à prévoir.']};
function sentence(base,ctx,i,page){let endings=['Et c’est précisément ce détail qui va compter plus tard.','Personne ne comprend encore sa véritable importance.','Pour ceux qui vivent la scène, cela ressemble simplement à une journée ordinaire.','Quelques heures plus tard, cette impression disparaît.','La nouvelle réalité commence ainsi, sans musique et sans avertissement.','Ce qui semble secondaire devient finalement le centre de l’histoire.','Le personnage ne possède évidemment pas la vision du futur.','Il avance avec les informations dont il dispose.','Cette limite rend sa décision beaucoup plus humaine.','La conséquence n’arrive pas immédiatement.','Elle s’installe d’abord dans les habitudes.','Puis quelqu’un remarque le changement.','Une autre personne refuse de l’accepter.','Le conflit devient alors inévitable.','Et pourtant, personne ne peut encore deviner où il conduira.'];return base+' '+endings[(i+page*3)%endings.length]}
function makePages(info,ctx){let pages=[];let names=['Le jour où tout commence','Les premières fissures','Le choix impossible','Le monde change','Ce que cette vie devient'];let bank=banks[info.type]||banks.général;for(let pg=0;pg<5;pg++){let ps=[];ps.push(`Dans cette réalité alternative, ${info.subject} n’est pas exactement ce que nous connaissons. Le point de départ réel sert uniquement de repère. À partir de la divergence demandée, cette histoire invente une trajectoire différente.`);if(ctx&&pg===0)ps.push(`Pour situer le récit, le moteur a consulté des informations publiques sur ${ctx.title}. Elles servent à conserver une base réaliste, mais les événements qui suivent sont fictifs.`);for(let i=0;i<49;i++){let b=bank[(i+pg*7)%bank.length];ps.push(sentence(b,ctx,i,pg));}pages.push({title:names[pg],text:ps});}return pages}
async function start(){let q=p.value.trim();if(!q){toast('Écris d’abord une idée.');p.focus();return}status.textContent='Compréhension…';bar.style.width='15%';let info=intent(q);await new Promise(r=>setTimeout(r,250));status.textContent='Recherche du contexte…';bar.style.width='30%';let ctx=await research(info.subject);status.textContent='Construction de la réalité…';bar.style.width='55%';await new Promise(r=>setTimeout(r,300));let pages=makePages(info,ctx);bar.style.width='85%';let title=info.alt?`Et si ${info.subject} ?`:`${info.subject}`;if(!info.alt&&info.asks)title=info.subject;current={id:Date.now(),q,mode,type:info.type,title,pages,ctx,created:new Date().toLocaleString('fr-FR')};render();bar.style.width='100%';status.textContent='Histoire prête';setTimeout(()=>bar.style.width='0',700)}
function render(){let s=current;w.innerHTML=`<article class="story"><div class="head"><div class="tag">${s.alt?'RÉALITÉ ALTERNATIVE':'RÉCIT'} · ${s.type.toUpperCase()}</div><h2>${esc(s.title)}</h2><p class="intro">${s.alt?'Point de divergence : '+esc(s.q):'Demande : '+esc(s.q)}<br><small>5 chapitres · 250 phrases minimum · mode ${s.mode}</small></p></div>${s.pages.map((pg,n)=>`<section class="page"><h3>${n+1}. ${esc(pg.title)}</h3>${pg.text.map((x,i)=>i===4?`<div class="scene">${esc(x)}</div>`:`<p class="para">${esc(x)}</p>`).join('')}${n===4?'<div class="choice" id="continue">▶ Continuer cette réalité</div><div class="choice" id="branch">↗ Créer une autre branche</div>':''}</section>`).join('')}<div class="toolbar"><button class="btn primary" id="save">Enregistrer</button><button class="btn" id="copy">Copier</button><button class="btn" id="share">Partager</button><button class="btn" id="print">Imprimer</button><button class="btn" id="again">Nouvelle</button></div></article>`;$('save').onclick=saveCurrent;$('copy').onclick=copyCurrent;$('share').onclick=shareCurrent;$('print').onclick=()=>print();$('again').onclick=()=>{p.value='';w.innerHTML='<div class="story"><div class="head"><h2>Une nouvelle réalité</h2><p class="intro">Écris une autre idée.</p></div></div>';p.focus()};$('continue').onclick=()=>{p.value=s.q+' — continue cette histoire après le cinquième chapitre, avec de nouveaux événements et sans recommencer.';start()};$('branch').onclick=()=>{p.value=s.q+' — crée une branche où un choix majeur différent est pris maintenant.';start()}}
function saveCurrent(){if(!current)return;let a=db().filter(x=>x.id!==current.id);a.unshift(current);put(a);toast('Histoire enregistrée.')}function copyCurrent(){if(!current)return;let t=current.pages.flatMap(x=>[x.title,...x.text]).join('\n\n');navigator.clipboard?.writeText(t).then(()=>toast('Récit copié.')).catch(()=>toast('Copie indisponible.'))}async function shareCurrent(){if(!current)return;let t=current.title+'\n\n'+current.pages[0].text.slice(0,8).join(' ');if(navigator.share)navigator.share({title:current.title,text:t}).catch(()=>{});else{await navigator.clipboard?.writeText(location.href);toast('Lien de l’application copié.')}}
function history(){let a=db();$('saved').innerHTML=a.length?a.map(x=>`<div class="save"><b>${esc(x.title)}</b><small>${esc(x.created)}</small><br><button class="btn" data-open="${x.id}">Ouvrir</button><button class="btn" data-del="${x.id}">Supprimer</button></div>`).join(''):'<p>Aucune histoire enregistrée.</p>';$('drawer').classList.remove('hidden');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{current=a.find(x=>x.id==b.dataset.open);render();$('drawer').classList.add('hidden')});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{put(db().filter(x=>x.id!=b.dataset.del));history();toast('Supprimée.')})}$('history').onclick=history;$('close').onclick=()=>$('drawer').classList.add('hidden');$('clear').onclick=()=>{if(confirm('Supprimer toutes les histoires ?')){put([]);history();toast('Historique supprimé.')}};$('go').onclick=start;$('new').onclick=()=>{p.value='';w.innerHTML='<div class="story"><div class="head"><h2>Une nouvelle réalité</h2><p class="intro">Écris ton idée.</p></div></div>';p.focus()};document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode});document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{p.value=b.textContent;p.focus()});$('help').onclick=()=>alert('Écris une idée librement. Le moteur identifie l’intention, consulte si possible un contexte public, puis construit une fiction ou un récit adapté. Une simulation complète contient 5 pages de 50 phrases minimum.');p.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter')start()});})();</script></body></html>
