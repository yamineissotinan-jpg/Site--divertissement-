<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Et si ? — Studio de réalités</title>
<meta name="description" content="Imagine une autre réalité, explore-la et raconte-la comme une histoire.">
<style>
:root{--bg:#070911;--panel:#0d1320;--panel2:#111a2a;--line:#26344c;--text:#f3f6fb;--muted:#93a0b5;--a:#8ff0d0;--b:#9db7ff;--danger:#ff8999;--shadow:0 24px 80px #0008}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 50% -10%,#1b2a47 0,#070911 65%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1120px;margin:auto;padding:24px 16px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:11px;font-weight:900;letter-spacing:.2em;color:var(--a)}.topnav{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#101827;color:var(--text);padding:10px 13px;border-radius:12px;font-weight:750}.btn:hover{border-color:#70809c}.btn.primary{background:var(--a);border-color:var(--a);color:#06100d}.btn.danger{color:#ffb4bd}.hero{padding:64px 0 30px;text-align:center}.hero h1{font-size:clamp(55px,11vw,105px);letter-spacing:-.08em;line-height:.85;margin:0 0 22px}.hero p{color:#b1bccd;max-width:650px;margin:auto;font-size:18px}.box{background:#0d1320eF;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:15px}.composer textarea{width:100%;min-height:150px;resize:vertical;background:#080c14;color:#fff;border:1px solid #2b3951;border-radius:17px;padding:18px;outline:none;font-size:19px;line-height:1.55}.composer textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px #8ff0d014}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.modes{display:flex;gap:5px}.mode.active{border-color:var(--a);color:var(--a)}.status{margin-left:auto;color:var(--muted);font-size:13px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 0}.chip{border:1px solid var(--line);background:#0b111c;color:#bac6d8;border-radius:999px;padding:8px 12px}.chip:hover{color:#fff;border-color:#687895}.workspace{margin-top:26px}.empty{padding:42px 18px;text-align:center;color:var(--muted);border:1px dashed #2a3850;border-radius:20px}.cover{padding:30px;background:linear-gradient(145deg,#141e31,#0a101a);border:1px solid var(--line);border-radius:22px}.kicker{color:var(--a);font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.cover h2{font-family:Georgia,serif;font-size:clamp(30px,5vw,54px);line-height:1.05;margin:9px 0 13px}.cover p{color:#c3ccda}.meta{display:flex;gap:7px;flex-wrap:wrap}.tag{border:1px solid #30405b;padding:5px 9px;border-radius:99px;color:#9eacc0;font-size:12px}.chapter{margin-top:14px;padding:30px;border:1px solid #202d43;background:#0d1320d9;border-radius:20px}.chapter h3{font-family:Georgia,serif;font-size:29px;margin:0 0 20px}.chapter p{font-family:Georgia,serif;font-size:19px;line-height:1.9;color:#e3e8f0;margin:0 0 18px}.scene{border-left:2px solid var(--a);padding:4px 0 4px 18px;margin:22px 0;color:#d7dfeb}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px;margin-top:18px}.fact{background:#080d16;border:1px solid #202d43;border-radius:14px;padding:13px}.fact small{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:10px}.fact b{font-size:17px}.choices{margin-top:20px;padding:18px;background:#080d16;border:1px solid var(--line);border-radius:18px}.choices button{display:block;width:100%;text-align:left;margin:8px 0}.source{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.source a{color:var(--b)}.side{position:fixed;right:18px;top:18px;width:min(390px,calc(100vw - 36px));max-height:calc(100vh - 36px);overflow:auto;background:#0b111cf7;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px;z-index:20}.side h3{margin-top:0}.saved{border:1px solid var(--line);border-radius:13px;padding:11px;margin:8px 0}.saved b{display:block}.saved small{color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#f1f5fb;color:#071018;padding:10px 15px;border-radius:12px;font-weight:800;z-index:30;box-shadow:var(--shadow)}.progress{height:4px;background:#172236;border-radius:9px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;width:0;background:var(--a);transition:width .25s}.dangerText{color:var(--danger)}@media(max-width:650px){.top{align-items:flex-start}.hero{padding:42px 0 22px}.hero h1{font-size:64px}.status{width:100%;margin-left:0}.chapter{padding:21px}.chapter p{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand">ET SI ?</div><nav class="topnav"><button class="btn" id="historyBtn">Mes histoires</button><button class="btn" id="shareApp">Partager</button><button class="btn" id="helpBtn">Aide</button></nav></header>
<section class="hero"><h1>Et si…</h1><p>Change une chose dans la réalité. Entre dans la vie, le monde ou l'époque qui aurait pu en découler.</p></section>
<section class="box composer">
<textarea id="prompt" placeholder="Et si Beyoncé était blanche ?\nEt si les humains disparaissaient ?\nEt si Napoléon gagnait Waterloo ?\nEt si je devenais milliardaire à 20 ans ?\nOu écris simplement ce qui te passe par la tête…"></textarea>
<div class="bar"><button class="btn primary" id="go">▶ Commencer</button><div class="modes"><button class="btn mode" data-mode="quick">Court</button><button class="btn mode active" data-mode="long">Long</button><button class="btn mode" data-mode="epic">Épique</button><button class="btn mode" data-mode="film">Film</button></div><button class="btn" id="newBtn">Nouvelle</button><span class="status" id="status">Prêt</span></div><div class="progress"><i id="progress"></i></div>
</section>
<div class="chips"><button class="chip">Et si Beyoncé était blanche ?</button><button class="chip">Et si les humains disparaissaient ?</button><button class="chip">Et si Internet disparaissait demain ?</button><button class="chip">Et si Napoléon gagnait Waterloo ?</button><button class="chip">Et si la Terre avait deux lunes ?</button><button class="chip">Et si je devenais président ?</button></div>
<section id="workspace" class="workspace"><div class="empty">Ton histoire apparaîtra ici.<br>Écris une idée. Pas besoin de trouver les bons mots.</div></section>
</div>
<aside id="side" class="side hidden"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Mes histoires</h3><button class="btn" id="closeSide">Fermer</button></div><div id="savedList"></div><button class="btn danger" id="deleteAll">Tout supprimer</button></aside>
<div id="toast" class="toast hidden"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), promptEl=$('prompt'), workspace=$('workspace'), status=$('status'), progress=$('progress');
let mode='long', current=null, busy=false;
const KEY='etsi_histories_v4';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const pick=(a,n)=>a[Math.abs(n)%a.length];
function saveAll(){localStorage.setItem(KEY,JSON.stringify(loadAll()));}
function loadAll(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),2200)}
function classify(q){const x=q.toLowerCase();
 if(/beyonc|taylor swift|rihanna|drake|messi|ronaldo|artiste|acteur|actrice|chanteur|chanteuse|célébrit|celebrite|star/.test(x))return'person';
 if(/humain|humanité|humanite|disparaî|disparai|sans humains|plus personne/.test(x))return'extinction';
 if(/napoléon|napoleon|waterloo|rome|empire|roi |reine |guerre|hitler|histoire|moyen âge|moyen age/.test(x))return'history';
 if(/internet|intelligence artificielle|ia |robot|ordinateur|smartphone|technologie|machine/.test(x))return'tech';
 if(/lune|mars|jupiter|gravité|gravite|planète|planete|soleil|espace|alien|univers/.test(x))return'science';
 if(/climat|pollution|forêt|foret|abeille|animal|océan|ocean|mer |espèce|espece|écologie|ecologie/.test(x))return'eco';
 if(/argent|million|milliard|entreprise|commerce|marché|marche|invest|banque|économie|economie|business/.test(x))return'economy';
 if(/président|president|gouvernement|ville|population|école|ecole|société|societe|pays|nation|loi/.test(x))return'society';
 if(/je |moi |ma vie|ma carrière|ma carriere|si j|devenais|vivais|partais|déménage|demenage/.test(x))return'life';
 return'general'}
function subject(q){let s=q.replace(/^(et si|imagine|imaginons|supposons que|que se passerait-il si)\s*/i,'').replace(/[?!.]+$/,'').trim();return s}
function factsFor(type,q){const subjectText=subject(q);return [{label:'Hypothèse',value:subjectText},{label:'Style',value:{quick:'Court',long:'Long',epic:'Épique',film:'Film'}[mode]},{label:'Nature',value:type==='person'?'Réalité alternative':type==='history'?'Histoire alternative':'Monde hypothétique'}]}
async function webContext(q){const s=subject(q).replace(/\b(etait|était|blanc|blanche|noir|noire|disparaissait|disparait|gagnait|perdait|avait|pouvait|devenait)\b/gi,' ').trim();if(!s)return null;try{const u='https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(s)+'&srlimit=2&format=json&origin=*';const r=await fetch(u,{headers:{Accept:'application/json'}});if(!r.ok)return null;const j=await r.json();const h=j?.query?.search?.[0];return h?{title:h.title,snippet:(h.snippet||'').replace(/<[^>]*>/g,''),url:'https://fr.wikipedia.org/wiki/'+encodeURIComponent(h.title.replace(/ /g,'_'))}:null}catch{return null}}
const data={
 person:{open:[s=>`Dans cette réalité, ${s} n'est pas exactement la personne que nous connaissons. Le changement intervient avant la célébrité, à une époque où personne ne peut encore mesurer son importance. Une famille existe, avec ses habitudes, ses inquiétudes et ses petits projets. Et au milieu de cette vie ordinaire, quelque chose commence à prendre une autre direction.`,s=>`Tout commence bien avant les projecteurs. Il y a une enfance, des rencontres, une première scène et des décisions minuscules qui, rétrospectivement, semblent presque écrites. Mais elles ne le sont pas. Dans cette version, une seule différence suffit à déplacer toute la trajectoire de ${s}.`],turn:[s=>`À l'adolescence, une porte s'ouvre. Rien ne garantit qu'elle sera franchie. Une personne remarque ${s}, puis une autre. Une occasion arrive trop tôt, une autre trop tard. C'est ici que cette histoire devient vraiment différente : les mêmes rêves peuvent exister, mais les chemins pour les atteindre ne sont plus les mêmes.`,s=>`Le premier grand tournant n'est pas une récompense. C'est un choix. Accepter signifie perdre autre chose. Refuser signifie peut-être ne jamais revenir à ce moment. ${s} choisit, et cette décision commence à produire des conséquences que personne ne pouvait voir.`],close:s=>`Des années plus tard, cette version de ${s} regarde son parcours avec un sentiment étrange. Beaucoup de choses semblent inévitables lorsqu'on les raconte après coup. Elles ne l'étaient pas. Une rencontre, une porte, un refus, un oui : la vie entière s'est construite autour de ces petits écarts.`},
 extinction:{open:[()=>`Le dernier jour de l'humanité ne ressemble pas à un film catastrophe. Il n'y a pas de ciel rouge ni de musique dramatique. Les villes fonctionnent encore. Des feux passent au vert. Des écrans brillent. Des machines continuent leur travail. Puis, progressivement, il n'y a plus personne pour les regarder.`,()=>`Au début, la planète ne remarque presque rien. Les océans continuent de bouger, le vent traverse les rues et les animaux restent méfiants devant les endroits qui leur étaient interdits. L'humanité a disparu ; le monde, lui, n'a aucune raison de s'arrêter.`],turn:[()=>`Les premières heures passent dans un silence étrange. Ensuite viennent les pannes. Certaines arrivent immédiatement, d'autres après des jours. Les systèmes qui avaient besoin d'humains commencent à s'interrompre les uns après les autres. Une ville entière peut encore sembler vivante alors que personne n'y vit plus.`,()=>`Après quelques semaines, les frontières humaines n'ont plus de sens. Une route reste une route, mais elle ne mène plus personne au travail. Une gare reste debout, mais les quais ne se remplissent plus. La nature ne « récupère » pas le monde d'un seul coup ; elle recommence simplement à occuper les espaces que les humains ne défendent plus.`],close:()=>`Un siècle passe. Puis un autre. Le béton se fissure, les métaux rouillent, les toits cèdent. Certaines œuvres disparaissent presque sans laisser de trace. D'autres survivent étonnamment longtemps. Après mille ans, la planète ne ressemble plus au monde que les humains avaient construit. Pourtant, ici et là, quelques fragments racontent encore qu'une civilisation immense a autrefois été là.`},
 history:{open:[()=>`Dans cette réalité, l'histoire bifurque à un endroit précis. Une décision change, une bataille se termine autrement, un message arrive à temps. Rien ne tremble dans le ciel. Pourtant, à partir de ce moment, les personnes qui vivent cette journée prennent leurs décisions avec un avenir différent devant elles.`,()=>`Le matin ressemble à celui que connaissent les livres. Puis quelque chose ne se passe pas comme prévu. Une armée tient quelques heures de plus. Un dirigeant hésite. Un allié change de camp. Et soudain, une victoire qui semblait impossible devient la nouvelle réalité.`],turn:[()=>`La victoire ne règle rien. Elle crée un problème plus grand : que faire du lendemain ? Les territoires doivent être administrés, les adversaires doivent réagir et les alliés demandent leur récompense. La nouvelle puissance découvre rapidement qu'il est beaucoup plus facile de gagner une bataille que de construire un siècle.`,()=>`Une génération grandit dans ce monde différent. Pour elle, les frontières et les héros de cette réalité sont normaux. Les enfants apprennent une histoire que personne, dans notre monde, n'a jamais vécue.`],close:()=>`Un siècle plus tard, les historiens de cette réalité reviennent au même moment. Ils y voient le début d'une chaîne d'événements que personne ne pouvait prévoir. Le monde est différent jusque dans ses détails les plus banals : les langues, les alliances, les villes et les souvenirs collectifs.`},
 tech:{open:[()=>`La première journée est confuse. Personne ne sait encore si le changement est une panne, une découverte ou le début de quelque chose de beaucoup plus grand. Les ingénieurs cherchent une explication pendant que les utilisateurs essaient simplement de continuer leur journée.`,()=>`Le changement paraît d'abord invisible. Puis un service s'arrête. Puis un autre. Les gens découvrent qu'une partie énorme de leur quotidien reposait sur quelque chose qu'ils ne voyaient presque jamais.`],turn:[()=>`Les premières semaines sont désordonnées. Certaines entreprises disparaissent. D'autres deviennent soudainement indispensables. Des solutions improvisées apparaissent, souvent imparfaites, parfois brillantes. Et parmi toutes ces tentatives, quelques-unes deviennent les fondations d'une nouvelle époque.`,()=>`Dix ans plus tard, une génération entière a grandi avec d'autres habitudes. Ce qui semblait impossible au début est devenu banal. Les métiers ont changé, les entreprises ont changé et même la façon de rencontrer quelqu'un n'est plus tout à fait la même.`],close:()=>`Au bout de plusieurs décennies, le changement initial est presque oublié. Les gens savent seulement que le monde actuel n'aurait jamais existé sans cette première rupture.`},
 science:{open:[()=>`Le premier indice est si petit que presque personne ne le remarque. Puis les observations se multiplient. Les scientifiques vérifient leurs instruments, recommencent les expériences et comprennent finalement qu'ils ne regardent pas une erreur : ils regardent un monde qui obéit désormais à une règle différente.`,()=>`Pendant quelques jours, les laboratoires travaillent sans presque dormir. Une anomalie se confirme, puis une deuxième. Ce qui semblait impossible devient la question la plus importante de la planète.`],turn:[()=>`Les premières conséquences ne ressemblent pas à celles des films. Elles apparaissent dans les marées, les infrastructures, l'agriculture ou les trajectoires des satellites. Chaque adaptation crée à son tour un nouveau problème.`,()=>`Les humains finissent par apprendre à vivre avec cette nouvelle règle. Des industries entières apparaissent, d'autres disparaissent, et une génération de scientifiques grandit avec des connaissances que les livres précédents n'avaient jamais enseignées.`],close:()=>`Des décennies plus tard, la découverte initiale est devenue un chapitre de l'histoire. Mais ses effets sont partout : dans les villes, les technologies, les habitudes et la façon dont l'humanité imagine son avenir.`},
 general:{open:[s=>`Dans cette réalité, tout commence par une petite différence : ${s}. Au début, personne ne sait si elle changera vraiment quelque chose. Puis une conséquence apparaît. Elle entraîne une deuxième décision, puis une troisième, et la vie commence à prendre une direction que personne n'avait prévue.`,s=>`Imagine le moment exact où cette réalité cesse d'être celle que nous connaissons. Rien n'explose. Quelqu'un fait simplement un choix différent, ou un événement arrive autrement. À partir de là, les personnes concernées doivent vivre avec un monde qui n'est plus tout à fait le même.`],turn:[s=>`Le changement devient impossible à ignorer. Des personnes profitent de la nouvelle situation, d'autres la subissent, et certaines essaient simplement de comprendre ce qui vient de leur arriver. C'est dans cette période que les conséquences les plus intéressantes apparaissent.`,s=>`Puis vient le retournement que personne n'avait prévu. Une conséquence secondaire atteint quelqu'un qui n'avait aucun rôle dans le changement initial. Une décision est prise pour résoudre le problème, mais elle ouvre une nouvelle porte.`],close:s=>`Avec le temps, cette réalité devient normale pour ceux qui y vivent. Ils ne se demandent plus comment le monde aurait pu être différent. Ils se demandent simplement comment vivre dans celui qu'ils ont reçu.`]}
};
function paragraphSet(type,q,seed,count){const d=data[type]||data.general,s=subject(q);const out=[];for(let i=0;i<count;i++){const pool=i===0?d.open:i===count-1?null:d.turn;const fn=i===count-1?d.close:pick(pool,seed+i*7);out.push(fn(s))}return out}
function buildChapters(type,q,seed){const count=mode==='quick'?3:mode==='long'?6:mode==='epic'?10:8;const times=type==='extinction'?['Le dernier jour','Les premières semaines','Un an plus tard','Dix ans plus tard','Un siècle plus tard','Mille ans plus tard']:['Le point de départ','Les premiers mois','Le premier grand tournant','Quelques années plus tard','Une nouvelle génération','Des décennies plus tard','Le monde change','Ce que personne n’avait prévu','Une autre époque','La dernière page'];const titles=['Le moment où tout bascule','Personne ne sait encore ce qui vient','Les conséquences commencent','La vie trouve un autre chemin','Le choix qui change tout','Le monde ne ressemble plus au même endroit','Une nouvelle normalité','Le prix du changement','Ce qui reste quand tout a changé','La dernière page'];const paras=paragraphSet(type,q,seed,count);let html='';for(let i=0;i<count;i++){const extra=i===1||i===Math.floor(count/2);html+=`<article class="chapter"><div class="kicker">${esc(times[i]||'Plus tard')}</div><h3>${esc(titles[i])}</h3><p>${esc(paras[i])}</p>${extra?`<div class="scene"><strong>Un détail que personne n'avait prévu.</strong><br>Ce n'est pas le changement initial qui bouleverse le plus cette réalité, mais la manière dont les gens commencent à s'y adapter.</div>`:''}${i===Math.floor(count/2)?`<div class="choices"><b>Tu veux intervenir dans cette réalité ?</b><button class="btn" data-choice="A">A — Laisser les événements suivre leur cours</button><button class="btn" data-choice="B">B — Introduire un changement inattendu</button><button class="btn" data-choice="C">C — Écrire ma propre décision</button></div>`:''}</article>`}return html}
function renderStory(q,ctx,seed,branch){const type=classify(q), label={person:'Récit biographique alternatif',extinction:'Fin d’une civilisation',history:'Histoire alternative',tech:'Futur alternatif',science:'Science-fiction spéculative',eco:'Monde écologique',economy:'Simulation économique',society:'Société alternative',life:'Vie alternative',general:'Réalité alternative'}[type]||'Réalité alternative';current={id:Date.now(),prompt:q,mode,type,title:q,ctx,branch:branch||'Original',html:''};const facts=factsFor(type,q);current.html=`<section class="cover"><div class="kicker">${esc(label)}</div><h2>${esc(q)}</h2><p><strong>Hypothèse :</strong> nous changeons volontairement un élément de la réalité. Le récit qui suit est une fiction construite à partir de cette divergence.</p><div class="meta">${facts.map(f=>`<span class="tag">${esc(f.label)} : ${esc(f.value)}</span>`).join('')}</div></section>${buildChapters(type,q,seed)}<div class="actions"><button class="btn primary" id="saveStory">Enregistrer</button><button class="btn" id="copyStory">Copier</button><button class="btn" id="shareStory">Partager le résultat</button><button class="btn" id="printStory">Imprimer / PDF</button><button class="btn" id="branchStory">Créer une autre réalité</button><button class="btn danger" id="deleteStory">Supprimer</button></div>${ctx?`<div class="source">Contexte réel consulté : <a href="${esc(ctx.url)}" target="_blank" rel="noopener">${esc(ctx.title)}</a><br>${esc(ctx.snippet)}<br><em>Cette source sert uniquement de contexte ; le récit est fictif.</em></div>`:''}`;workspace.innerHTML=current.html;bindStory();}
function textFromStory(){return workspace.innerText.replace(/\n{3,}/g,'\n\n').trim()}
function bindStory(){
 $('saveStory').onclick=()=>{const all=loadAll().filter(x=>x.id!==current.id);all.unshift({...current,html:workspace.innerHTML,savedAt:new Date().toISOString()});localStorage.setItem(KEY,JSON.stringify(all));toast('Histoire enregistrée');};
 $('copyStory').onclick=async()=>{try{await navigator.clipboard.writeText(textFromStory());toast('Histoire copiée')}catch{toast('Copie indisponible dans ce navigateur')}};
 $('shareStory').onclick=()=>shareText(current.title+' — Et si ?',textFromStory().slice(0,900)+'\n\nDécouvre la simulation : '+location.href);
 $('printStory').onclick=()=>window.print();
 $('deleteStory').onclick=()=>{if(!confirm('Supprimer cette histoire ?'))return;localStorage.setItem(KEY,JSON.stringify(loadAll().filter(x=>x.id!==current.id)));newStory();toast('Histoire supprimée')};
 $('branchStory').onclick=()=>{promptEl.value=current.prompt+' — cette fois, imagine une autre trajectoire';start(true)};
 workspace.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const c=b.dataset.choice;if(c==='C'){const v=prompt('Quelle décision veux-tu imposer à cette réalité ?');if(v){promptEl.value=current.prompt+'\nDécision imposée : '+v;start(true)}}else{promptEl.value=current.prompt+'\nDécision : '+c;start(true)}})
}
async function shareText(title,text){if(navigator.share){try{await navigator.share({title,text})}catch{}}else{try{await navigator.clipboard.writeText(text);toast('Texte de partage copié')}catch{toast('Partage indisponible')}}}
async function start(branch=false){if(busy)return;const q=promptEl.value.trim();if(q.length<3){toast('Écris au moins une idée.');promptEl.focus();return}busy=true;$('go').disabled=true;status.textContent='Je prépare ton monde…';progress.style.width='12%';workspace.innerHTML='<div class="empty"><span class="spinner"></span>Je comprends ton idée et je construis la réalité alternative…</div>';await sleep(180);progress.style.width='30%';const ctx=await webContext(q);progress.style.width='48%';await sleep(120);const seed=hash(q+'|'+mode+'|'+(branch?'branch':'origin'));status.textContent='J’écris l’histoire…';await sleep(160);renderStory(q,ctx,seed,branch?'Nouvelle trajectoire':'Original');progress.style.width='100%';status.textContent='Histoire prête';setTimeout(()=>progress.style.width='0',600);busy=false;$('go').disabled=false;window.scrollTo({top:document.querySelector('.workspace').offsetTop-15,behavior:'smooth'});}
function newStory(){current=null;workspace.innerHTML='<div class="empty">Ton histoire apparaîtra ici.<br>Écris une idée. Pas besoin de trouver les bons mots.</div>';promptEl.value='';status.textContent='Prêt';progress.style.width='0';}
function renderSaved(){const list=$('savedList'),all=loadAll();if(!all.length){list.innerHTML='<p style="color:var(--muted)">Aucune histoire enregistrée.</p>';return}list.innerHTML=all.map(x=>`<div class="saved"><b>${esc(x.title)}</b><small>${esc(x.mode)} · ${new Date(x.savedAt||x.id).toLocaleString('fr-FR')}</small><div class="bar"><button class="btn" data-open="${x.id}">Ouvrir</button><button class="btn danger" data-del="${x.id}">Supprimer</button></div></div>`).join('');list.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const x=all.find(v=>String(v.id)===b.dataset.open);if(!x)return;current=x;workspace.innerHTML=x.html;bindStory();$('side').classList.add('hidden');toast('Histoire ouverte')});list.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{localStorage.setItem(KEY,JSON.stringify(all.filter(x=>String(x.id)!==b.dataset.del)));renderSaved();toast('Supprimée')})}
$('go').onclick=()=>start();$('newBtn').onclick=newStory;promptEl.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')start()});document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode});document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{promptEl.value=b.textContent;promptEl.focus()});$('historyBtn').onclick=()=>{$('side').classList.remove('hidden');renderSaved()};$('closeSide').onclick=()=>$('side').classList.add('hidden');$('deleteAll').onclick=()=>{if(confirm('Supprimer toutes les histoires enregistrées ?')){localStorage.removeItem(KEY);renderSaved();toast('Toutes les histoires ont été supprimées')}};$('shareApp').onclick=()=>shareText('Et si ?','Imagine une autre réalité et raconte-la : '+location.href);$('helpBtn').onclick=()=>alert('Écris n’importe quelle idée. Le site cherche du contexte réel quand il peut, puis raconte une réalité alternative fictive. Tu peux enregistrer, supprimer, partager, créer une autre trajectoire et reprendre tes histoires.');
window.addEventListener('storage',renderSaved);
})();
</script>
