<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Et si ?</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b12;color:#f5f7fb;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.2em;color:#8ff0d0}.btn{border:1px solid #2b3950;background:#111a29;color:#fff;border-radius:12px;padding:11px 14px;cursor:pointer;font-weight:700}.btn:hover{border-color:#8ff0d0}.primary{background:#8ff0d0;color:#06100d;border-color:#8ff0d0}.danger{color:#ff9eac}.hero{text-align:center;padding:60px 0 30px}.hero h1{font-size:clamp(60px,12vw,110px);margin:0;letter-spacing:-.08em}.hero p{color:#aab7c8;font-size:18px}.box{background:#0e1521;border:1px solid #27354b;border-radius:22px;padding:16px}.prompt{width:100%;min-height:170px;background:#080d15;color:#fff;border:1px solid #2c3a51;border-radius:16px;padding:17px;font:19px/1.5 Arial;resize:vertical}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}.status{color:#9aa8bd;margin-left:auto}.mode.active{border-color:#8ff0d0;color:#8ff0d0}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid #29374d;background:#0d1522;color:#c4cede;border-radius:999px;padding:9px 12px;cursor:pointer}.workspace{margin-top:25px}.empty{text-align:center;color:#9aa8bd;border:1px dashed #2b3950;border-radius:18px;padding:50px}.cover,.chapter,.choices{background:#0e1521;border:1px solid #27354b;border-radius:18px;padding:25px;margin-bottom:14px}.cover h2,.chapter h3{font-family:Georgia,serif}.cover h2{font-size:42px}.chapter h3{font-size:29px}.chapter p{font:18px/1.85 Georgia,serif;color:#e3e8f0}.scene{border-left:3px solid #8ff0d0;padding-left:15px;font:18px/1.7 Georgia,serif;color:#d8e0ea;margin:20px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.choices button{display:block;width:100%;text-align:left;margin:8px 0}.side{position:fixed;right:15px;top:15px;width:min(420px,calc(100% - 30px));max-height:90vh;overflow:auto;background:#0b111c;border:1px solid #30405a;border-radius:18px;padding:18px;z-index:5}.hidden{display:none}.saved{border:1px solid #29374d;border-radius:12px;padding:12px;margin:8px 0}.saved small{display:block;color:#9aa8bd;margin:6px 0}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#fff;color:#071018;padding:11px 16px;border-radius:10px;font-weight:800;z-index:20}.progress{height:4px;background:#182438;margin-top:12px}.progress i{display:block;width:0;height:100%;background:#8ff0d0;transition:width .2s}@media(max-width:650px){.status{width:100%;margin-left:0}.hero{padding-top:40px}.cover h2{font-size:32px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand">ET SI ?</div><div><button class="btn" id="history">Mes histoires</button> <button class="btn" id="help">Aide</button></div></header>
<section class="hero"><h1>Et si…</h1><p>Change une chose dans la réalité. Découvre l'histoire qui pourrait en naître.</p></section>
<section class="box">
<textarea id="prompt" class="prompt" placeholder="Et si Beyoncé était blanche ?&#10;Et si les humains disparaissaient ?&#10;Écris n'importe quelle idée…"></textarea>
<div class="toolbar"><button class="btn primary" id="start">▶ Commencer</button><button class="btn mode" data-mode="Court">Court</button><button class="btn mode active" data-mode="Long">Long</button><button class="btn mode" data-mode="Épique">Épique</button><button class="btn mode" data-mode="Film">Film</button><button class="btn" id="new">Nouvelle</button><span class="status" id="status">Prêt</span></div><div class="progress"><i id="bar"></i></div>
</section>
<div class="chips"><button class="chip">Et si Beyoncé était blanche ?</button><button class="chip">Et si les humains disparaissaient ?</button><button class="chip">Et si Internet disparaissait demain ?</button><button class="chip">Et si Napoléon gagnait Waterloo ?</button><button class="chip">Et si la Terre avait deux lunes ?</button></div>
<section id="workspace" class="workspace"><div class="empty">Ton histoire apparaîtra ici.</div></section>
</div>
<aside id="drawer" class="side hidden"><div style="display:flex;justify-content:space-between"><h3>Mes histoires</h3><button class="btn" id="close">Fermer</button></div><div id="saved"></div><button class="btn danger" id="clear">Tout supprimer</button></aside>
<div id="toast" class="toast hidden"></div>
<script>
(function(){
var promptBox=document.getElementById('prompt');
var workspace=document.getElementById('workspace');
var statusBox=document.getElementById('status');
var bar=document.getElementById('bar');
var mode='Long';
var current=null;
var KEY='etsi_stories_v6';
function toast(text){var t=document.getElementById('toast');t.textContent=text;t.classList.remove('hidden');setTimeout(function(){t.classList.add('hidden')},1800)}
function escapeHtml(text){var d=document.createElement('div');d.textContent=text;return d.innerHTML}
function getSaved(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function setSaved(a){localStorage.setItem(KEY,JSON.stringify(a))}
function makeStory(q){
var lower=q.toLowerCase();var title='Une autre réalité';var intro='';
if(lower.indexOf('beyoncé')>=0||lower.indexOf('beyonce')>=0){title='Beyoncé — une autre vie';intro='Houston, au début des années 1980. Dans cette réalité, un détail fondamental de la vie de Beyoncé est différent. Le reste du monde, lui, continue d’exister. Sa famille, son enfance, ses rencontres et ses choix vont maintenant évoluer autour de cette nouvelle réalité.'}
else if(lower.indexOf('humain')>=0&&(lower.indexOf('dispara')>=0||lower.indexOf('sans')>=0)){title='Le monde après les humains';intro='Le dernier jour ne ressemble pas à une scène de cinéma. Les lumières sont encore allumées. Des voitures sont garées. Des machines continuent leur travail. Puis le silence devient permanent. Il n’y a plus personne pour répondre.'}
else if(lower.indexOf('napoléon')>=0||lower.indexOf('napoleon')>=0||lower.indexOf('waterloo')>=0){title='Waterloo — l’autre victoire';intro='18 juin 1815. La pluie transforme le champ de bataille en boue. Cette fois, un ordre arrive au bon moment et une brèche apparaît. À la tombée de la nuit, Napoléon n’a pas perdu. L’Europe vient de changer de trajectoire.'}
else if(lower.indexOf('internet')>=0){title='Le jour où Internet s’est tu';intro='À 8 h 00, Internet fonctionne encore. À 8 h 01, les connexions cessent. Au début, personne ne comprend. Puis les minutes passent, les systèmes ralentissent et chacun réalise que le monde moderne dépendait de choses qu’on ne remarquait plus.'}
else if(lower.indexOf('lune')>=0){title='La deuxième lune';intro='La première observation semble être une erreur. Une deuxième lune apparaît pourtant dans le ciel. En quelques heures, les astronomes comprennent que le phénomène est réel. Les marées, les nuits et les habitudes humaines vont changer.'}
else{title='Et si '+q.replace(/^et si\s*/i,'');intro='Tout commence par cette idée : « '+q+' ». Dans notre réalité, ce n’est pas exactement ainsi. Pour cette histoire, une seule règle change. À partir de ce point, les personnes concernées doivent vivre avec les conséquences de cette nouvelle réalité.'}
var chapters=[
['PROLOGUE — LE PREMIER JOUR',[intro,'Au début, presque personne ne mesure l’importance du changement. Une journée ordinaire peut cacher le début d’une histoire extraordinaire. Les premières réactions sont humaines : certains doutent, d’autres profitent de l’occasion, d’autres encore cherchent simplement à comprendre.','Puis quelqu’un prend une décision. Ce n’est pas forcément la décision la plus spectaculaire. Mais elle ouvre la première porte de cette réalité alternative.']],
['CHAPITRE I — LA VIE COMMENCE À CHANGER',['Les jours suivants donnent au changement une forme concrète. Les habitudes se déplacent. Certaines personnes découvrent une opportunité qu’elles n’auraient jamais eue auparavant. D’autres perdent quelque chose qu’elles considéraient acquis.','Dans une petite pièce, une conversation change la trajectoire d’un personnage. Dans une autre ville, un événement apparemment sans rapport commence à produire ses propres conséquences.','C’est à ce moment que cette réalité cesse d’être une simple hypothèse. Elle devient une histoire vécue.']],
['CHAPITRE II — LE TOURNANT',['Les mois passent. Les premières conséquences en entraînent d’autres. Ce qui semblait impossible devient normal, puis suffisamment normal pour être oublié.','Mais une nouvelle génération grandit avec cette réalité. Elle ne compare pas son monde au nôtre. Pour elle, ce monde est simplement le monde.','Puis arrive un événement que personne n’avait prévu. Il oblige les personnages à choisir entre deux chemins.']],
['CHAPITRE III — LE CHOIX',['Le choix est difficile parce qu’il n’existe pas de solution parfaite. Une décision protège une chose et en met une autre en danger.','La décision est finalement prise. Pendant quelques secondes, rien ne semble changer. Puis les conséquences commencent à apparaître.','Une rencontre change. Une opportunité disparaît. Une autre apparaît. Et quelqu’un qui n’avait jusque-là aucun rôle devient soudain essentiel.']],
['CHAPITRE IV — DES ANNÉES PLUS TARD',['Des années passent. Les conséquences initiales se mélangent maintenant aux décisions prises entre-temps. Les personnes qui étaient au début de l’histoire ont changé. Certaines ont disparu. D’autres sont devenues célèbres.','Les enfants de cette réalité ne comprennent plus pourquoi leurs parents parlaient autrefois de « l’ancien monde ». Pour eux, cette histoire a toujours été normale.','Mais un détail du passé refait surface. Et il oblige tout le monde à regarder de nouveau le jour où cette réalité a commencé.']],
['ÉPILOGUE — L’AUTRE DESTIN',['Avec le recul, tout paraît presque inévitable. Pourtant rien ne l’était. Une rencontre différente, un choix différent ou un événement arrivé quelques minutes plus tôt aurait pu créer un autre monde.','C’est la particularité d’un « et si » : on ne change pas seulement une réponse. On change les vies qui viennent après.','Et cette histoire pourrait encore continuer.']]
];
if(mode==='Court')chapters=chapters.slice(0,3);if(mode==='Épique')chapters=chapters.concat(chapters.slice(2,5));if(mode==='Film')chapters=chapters.map(function(c){c[1].push('La scène se termine. Pendant un instant, personne ne parle. Puis un nouveau détail apparaît, et tout recommence.');return c});
return {id:String(Date.now())+Math.random(),title:title,query:q,mode:mode,chapters:chapters,date:new Date().toLocaleString('fr-FR')};
}
function render(story){current=story;var html='<div class="cover"><small>FICTION — '+escapeHtml(story.mode)+'</small><h2>'+escapeHtml(story.title)+'</h2><p><b>Hypothèse :</b> '+escapeHtml(story.query)+'</p><div class="actions"><button class="btn primary" id="save">Enregistrer</button><button class="btn" id="copy">Copier</button><button class="btn" id="share">Partager</button><button class="btn" id="print">Imprimer</button><button class="btn" id="branch">Nouvelle branche</button></div></div>';
story.chapters.forEach(function(c){html+='<article class="chapter"><h3>'+escapeHtml(c[0])+'</h3>';c[1].forEach(function(p){html+='<p>'+escapeHtml(p)+'</p>'});html+='</article>'});
html+='<div class="choices"><h3>Et maintenant ?</h3><button class="btn" id="continue">▶ Continuer cette histoire</button><button class="btn" id="surprise">⚡ Introduire un événement inattendu</button><button class="btn" id="custom">✍ Ma propre décision</button></div>';workspace.innerHTML=html;
document.getElementById('save').onclick=saveCurrent;
document.getElementById('copy').onclick=copyCurrent;
document.getElementById('share').onclick=function(){shareText(story.title)};
document.getElementById('print').onclick=function(){window.print()};
document.getElementById('branch').onclick=function(){continueStory('Une autre décision est prise')};
document.getElementById('continue').onclick=function(){continueStory('La trajectoire continue')};
document.getElementById('surprise').onclick=function(){continueStory('Un événement inattendu bouleverse la situation')};
document.getElementById('custom').onclick=function(){var d=window.prompt('Que veux-tu changer ?');if(d)continueStory(d)};
}
function continueStory(decision){var n=JSON.parse(JSON.stringify(current));n.id=String(Date.now())+Math.random();n.chapters.push(['CHAPITRE SUIVANT',[decision+'. Pendant quelques secondes, rien ne semble différent. Puis les conséquences apparaissent.','Les personnages doivent maintenant vivre avec cette nouvelle décision. Une possibilité se ferme, une autre apparaît et personne ne sait encore laquelle dominera.','La suite appartient à cette nouvelle trajectoire.']]);render(n);window.scrollTo(0,document.body.scrollHeight)}
function saveCurrent(){if(!current)return;var a=getSaved().filter(function(x){return x.id!==current.id});a.unshift(current);setSaved(a);toast('Enregistrée');}
function copyCurrent(){if(!current)return;var text=current.title+'\n\n'+current.chapters.map(function(c){return c[0]+'\n'+c[1].join('\n\n')}).join('\n\n');if(navigator.clipboard){navigator.clipboard.writeText(text).then(function(){toast('Copiée')}).catch(function(){fallbackCopy(text)})}else fallbackCopy(text)}
function fallbackCopy(text){var x=document.createElement('textarea');x.value=text;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove();toast('Copiée')}
function shareText(text){if(navigator.share){navigator.share({title:'Et si ?',text:text,url:location.href}).catch(function(){})}else{fallbackCopy(text+'\n'+location.href);toast('Lien copié')}}
function renderHistory(){var list=document.getElementById('saved');var a=getSaved();if(!a.length){list.innerHTML='<p>Aucune histoire enregistrée.</p>';return}list.innerHTML=a.map(function(x){return '<div class="saved"><b>'+escapeHtml(x.title)+'</b><small>'+escapeHtml(x.query)+'</small><button class="btn open" data-id="'+escapeHtml(x.id)+'">Ouvrir</button> <button class="btn danger del" data-id="'+escapeHtml(x.id)+'">Supprimer</button></div>'}).join('');Array.prototype.forEach.call(document.querySelectorAll('.open'),function(b){b.onclick=function(){var x=getSaved().find(function(z){return z.id===b.getAttribute('data-id')});if(x){render(x);document.getElementById('drawer').classList.add('hidden')}}});Array.prototype.forEach.call(document.querySelectorAll('.del'),function(b){b.onclick=function(){setSaved(getSaved().filter(function(x){return x.id!==b.getAttribute('data-id')}));renderHistory();toast('Supprimée')}})}
document.getElementById('start').onclick=function(){var q=promptBox.value.trim();if(!q){toast('Écris une idée');promptBox.focus();return}statusBox.textContent='Construction…';bar.style.width='40%';setTimeout(function(){bar.style.width='75%';var s=makeStory(q);render(s);bar.style.width='100%';statusBox.textContent='Terminé';setTimeout(function(){bar.style.width='0%'},500)},250)};
Array.prototype.forEach.call(document.querySelectorAll('.mode'),function(b){b.onclick=function(){mode=b.getAttribute('data-mode');Array.prototype.forEach.call(document.querySelectorAll('.mode'),function(x){x.classList.remove('active')});b.classList.add('active');statusBox.textContent='Mode '+mode}});
Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(b){b.onclick=function(){promptBox.value=b.textContent;promptBox.focus()}});
document.getElementById('new').onclick=function(){promptBox.value='';current=null;workspace.innerHTML='<div class="empty">Nouvelle histoire prête.</div>';statusBox.textContent='Prêt';promptBox.focus()};
document.getElementById('history').onclick=function(){renderHistory();document.getElementById('drawer').classList.remove('hidden')};
document.getElementById('close').onclick=function(){document.getElementById('drawer').classList.add('hidden')};
document.getElementById('clear').onclick=function(){if(window.confirm('Supprimer toutes les histoires ?')){localStorage.removeItem(KEY);renderHistory();toast('Tout a été supprimé')}};
document.getElementById('help').onclick=function(){window.alert('Écris une idée, choisis un mode et clique sur Commencer. Ensuite tu peux enregistrer, copier, partager, imprimer ou modifier la trajectoire.')};
promptBox.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='Enter')document.getElementById('start').click()});
})();
</script>
</body>
</html>
