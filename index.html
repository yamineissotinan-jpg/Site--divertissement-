<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Et si ? — Réalités alternatives</title>
<meta name="description" content="Imagine une autre réalité et découvre l'histoire qui aurait pu en naître.">
<style>
:root{--bg:#070910;--panel:#0e1320;--panel2:#121a2a;--line:#263249;--text:#eef3fb;--muted:#8d99ad;--accent:#8ff0d0;--accent2:#9bb7ff;--danger:#ff8f9d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#18243c 0,#070910 48%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.75}main{max-width:1080px;margin:auto;padding:34px 18px 90px}.brand{letter-spacing:.18em;font-size:11px;color:var(--accent);font-weight:800}.hero{padding:34px 0 22px}.hero h1{font-size:clamp(48px,9vw,92px);line-height:.95;margin:8px 0 18px;letter-spacing:-.06em}.hero p{max-width:720px;color:#aeb8c9;font-size:18px}.composer{background:rgba(14,19,32,.9);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 22px 70px rgba(0,0,0,.28);position:sticky;top:12px;z-index:5}.composer textarea{display:block;width:100%;min-height:130px;resize:vertical;background:#090d16;border:1px solid #263249;border-radius:16px;color:white;padding:17px;font:inherit;font-size:19px;outline:none}.composer textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(143,240,208,.08)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.button{border:1px solid var(--line);background:#121a2a;color:var(--text);border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer}.button:hover{border-color:#61718d}.primary{background:var(--accent);color:#06100d;border-color:var(--accent)}.mode.active{border-color:var(--accent);color:var(--accent)}.status{margin-left:auto;color:var(--muted);font-size:13px}.examples{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid var(--line);background:transparent;color:#b9c4d7;border-radius:999px;padding:7px 11px;cursor:pointer}.chip:hover{color:white;border-color:#687996}.story{margin-top:30px}.cover{background:linear-gradient(145deg,#121a2a,#0b101a);border:1px solid var(--line);border-radius:22px;padding:28px;margin-bottom:16px}.cover h2{font-size:clamp(27px,5vw,46px);line-height:1.1;margin:8px 0 12px}.label{font-size:11px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase;font-weight:800}.note{color:var(--muted);font-size:13px}.chapter{background:rgba(14,19,32,.78);border:1px solid #202c41;border-radius:20px;padding:28px;margin:14px 0}.chapter h2{font-family:Georgia,serif;font-size:28px;line-height:1.2;margin:5px 0 18px}.chapter p{font-family:Georgia,serif;font-size:18px;color:#dfe5ee;margin:0 0 17px}.chapter:first-letter{}.choice{background:#0a0f18;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:20px}.choice h3{margin:0 0 10px}.choice button{display:block;width:100%;text-align:left;margin:8px 0}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:18px 0}.fact{background:#0a0f18;border:1px solid var(--line);border-radius:14px;padding:13px}.fact b{display:block;color:var(--accent);font-size:12px;letter-spacing:.1em;text-transform:uppercase}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.sources{border-top:1px solid var(--line);margin-top:24px;padding-top:18px}.sources a{color:var(--accent2)}.hidden{display:none}.error{border-color:#60303a}.loading{color:#aeb8c9}.spinner{display:inline-block;width:12px;height:12px;border:2px solid #52617a;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:650px){main{padding:22px 12px 60px}.composer{position:static}.chapter{padding:20px}.chapter p{font-size:17px}}
</style>
</head>
<body>
<main>
  <div class="brand">LABORATOIRE DE RÉALITÉS ALTERNATIVES</div>
  <section class="hero">
    <h1>Et si…</h1>
    <p>Change une seule chose dans la réalité. Puis entre dans la vie qui aurait pu en découler.</p>
  </section>

  <section class="composer">
    <textarea id="prompt" aria-label="Votre scénario" placeholder="Et si Beyoncé était blanche ?
Et si les humains disparaissaient demain ?
Et si Internet cessait d'exister ?
Et si Napoléon gagnait Waterloo ?
Ou écris simplement ton idée…"></textarea>
    <div class="toolbar">
      <button class="button primary" id="go">▶ Entrer dans l'histoire</button>
      <button class="button mode active" data-mode="long">Long</button>
      <button class="button mode" data-mode="epic">Épique</button>
      <button class="button" id="clear">Nouvelle</button>
      <span class="status" id="status">Prêt</span>
    </div>
  </section>

  <div class="examples" id="examples">
    <button class="chip">Et si Beyoncé était blanche ?</button>
    <button class="chip">Et si les humains disparaissaient ?</button>
    <button class="chip">Et si Internet disparaissait demain ?</button>
    <button class="chip">Et si Napoléon gagnait Waterloo ?</button>
    <button class="chip">Et si la Terre avait deux lunes ?</button>
  </div>

  <section id="story" class="story"></section>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  let mode='long', current=null;
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clean=s=>s.trim().replace(/\s+/g,' ');
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
  const pick=(arr,seed)=>arr[seed%arr.length];

  function classify(q){
    const x=q.toLowerCase();
    if(/dispar(a|â)it|plus aucun humain|sans humains|humanit(e|é) dispara/.test(x))return'extinction';
    if(/beyonc|taylor swift|rihanna|drake|messi|ronaldo|acteur|actrice|chanteur|chanteuse|artiste|c(e|é)l(e|é)brit|star|personne|je devenais|je devenais/.test(x))return'person';
    if(/napol(e|é)on|waterloo|rome|empire|moyen age|roi |reine |guerre|hitler|colonisation|histoire/.test(x))return'history';
    if(/internet|ia |intelligence artificielle|robot|ordinateur|smartphone|technolog|machine/.test(x))return'tech';
    if(/lune|mars|jupiter|gravité|gravite|plan(è|e)te|soleil|espace|extraterrestre|alien|univers/.test(x))return'science';
    if(/climat|pollution|for(ê|e)t|abeille|animal|oc(é|e)an|mer |esp(è|e)ce|écosystème|ecosystem/.test(x))return'eco';
    if(/argent|million|milliard|entreprise|commerce|march(e|é)|invest|banque|économie|economie|business/.test(x))return'economy';
    if(/président|president|gouvernement|ville|population|école|ecole|société|societe|pays|nation|loi/.test(x))return'society';
    if(/je |moi |ma vie|ma carrière|ma carriere|si j|devenais|vivais|partais|déménage|demenage/.test(x))return'life';
    return'general';
  }

  function subject(q){
    let s=q.replace(/^(et si|imagine|supposons que|imaginons que|que se passerait-il si)\s*/i,'').trim();
    s=s.replace(/[?!.]+$/,'').trim();
    const m=s.match(/^(.+?)\s+(?:était|etait|était née|etait nee|était né|etait ne|avait|devenait|disparaissait|gagnait|perdait|pouvait|puisse|existait)\b/i);
    return (m?m[1]:s).trim();
  }

  async function reality(q){
    const s=subject(q); const url='https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(s)+'&format=json&origin=*';
    try{
      const r=await fetch(url,{headers:{Accept:'application/json'}}); if(!r.ok)throw new Error('web');
      const j=await r.json(); const hit=j?.query?.search?.[0];
      if(!hit)return null;
      return {title:hit.title,snippet:(hit.snippet||'').replace(/<[^>]+>/g,'')};
    }catch(e){return null}
  }

  const voices={
    person:{open:[
      s=>`Dans cette autre réalité, l'histoire de ${s} ne commence pas exactement comme dans la nôtre. Une seule hypothèse vient de changer, mais autour d'elle, une famille entière doit maintenant vivre avec cette nouvelle réalité.`,
      s=>`Pour ${s}, tout commence avant la célébrité. Il y a une maison, des parents, des habitudes, une école et des rencontres dont personne ne soupçonne encore l'importance.`],
      turns:[
        s=>`À l'adolescence, une rencontre apparemment banale ouvre une porte que personne n'avait prévue. Ce jour-là, ${s} ne sait pas encore qu'une décision de quelques minutes va peser sur les vingt prochaines années.`,
        s=>`Le premier succès arrive différemment. Une personne entend parler de ${s}, puis une autre. Les occasions s'accumulent, mais chacune a un prix : choisir une route signifie en abandonner une autre.`],
      endings:[s=>`Des années plus tard, lorsque ${s} regarde cette vie, une question revient pourtant : que serait-il arrivé si cette toute première rencontre n'avait jamais eu lieu ?`,s=>`C'est ainsi que cette version de ${s} finit par exister : non pas parce qu'un destin était écrit, mais parce qu'une longue suite de petites décisions a poussé la vie dans une autre direction.`]},
    extinction:{open:[()=>`Le dernier jour ne ressemble pas à la fin du monde. Il ressemble à une journée ordinaire dont personne ne verra la fin. Les lumières sont encore allumées, des voitures sont arrêtées dans les rues et des appareils continuent de fonctionner sans savoir que ceux qui les ont construits ne reviendront pas.`,()=>`Il n'y a pas de grand signal dans le ciel. L'humanité s'éteint et, pendant un moment, la planète continue exactement comme avant. C'est cette indifférence du monde qui rend les premières heures presque irréelles.`],turns:[()=>`Après quelques jours, les systèmes conçus pour être surveillés commencent à montrer leurs limites. Une centrale s'arrête. Un réseau électrique se fragmente. Une porte automatique reste ouverte. À petite échelle, le monde commence à perdre les gestes qui le maintenaient en ordre.`,()=>`Les animaux ne comprennent évidemment pas ce qui s'est passé. Ils constatent seulement que certains territoires deviennent soudainement accessibles. Une ville n'est plus une ville pour eux : c'est un immense espace rempli d'abris, d'eau et de nourriture.`],endings:[()=>`Cent ans plus tard, les traces humaines sont toujours là, mais elles ont changé de nature. Le béton s'est fissuré, les métaux ont rouillé et les plantes ont repris des endroits que l'on croyait définitivement conquis.`,()=>`Un millénaire passe. Quelques structures exceptionnelles survivent encore. Elles ne racontent plus une civilisation vivante ; elles ressemblent à des fragments d'une époque dont aucun témoin ne subsiste.`]},
    history:{open:[()=>`Dans cette version de l'histoire, la divergence paraît d'abord minuscule. Une décision change, un messager arrive à temps, une bataille se termine autrement. Mais l'histoire ne pardonne pas les petites bifurcations : les alliances commencent à bouger.`,()=>`Le monde connaît le même matin que dans notre histoire, puis un événement différent survient. À partir de cet instant, les hommes prennent des décisions avec des informations différentes, et chaque décision rend la suivante plus difficile à prévoir.`],turns:[()=>`La première victoire ne suffit pourtant pas. Il faut administrer les territoires, convaincre les alliés et répondre aux adversaires qui comprennent rapidement que l'équilibre vient de changer.`,()=>`Une génération grandit dans ce nouveau monde. Pour elle, ce qui nous semble extraordinaire est devenu normal. Les frontières, les ambitions et même les souvenirs collectifs commencent à prendre une autre forme.`],endings:[()=>`Un siècle plus tard, les historiens de cette réalité regardent le point de divergence comme nous regardons aujourd'hui les grandes décisions de notre propre passé. Ils savent qu'une seule journée a suffi à produire un autre siècle.`,()=>`La carte du monde est différente, mais le plus grand changement est ailleurs : des millions de personnes ont grandi avec une histoire qu'aucun de nos livres ne raconte.`]},
    tech:{open:[()=>`Le changement arrive presque sans bruit. Au début, quelques personnes remarquent seulement que quelque chose fonctionne différemment. Puis les entreprises comprennent que ce n'est pas un incident.`,()=>`La première journée est confuse. Les ingénieurs cherchent une explication, les utilisateurs essaient de comprendre ce qu'ils peuvent encore faire et, pendant quelques heures, personne ne sait si le changement durera une minute ou toute une génération.`],turns:[()=>`Les entreprises qui dépendaient entièrement de l'ancien système doivent improviser. Certaines échouent en quelques semaines. D'autres découvrent des solutions qu'elles n'auraient jamais développées dans l'ancien monde.`,()=>`Une nouvelle génération grandit avec des habitudes différentes. Ce qui semblait être une catastrophe devient progressivement une contrainte ordinaire, puis un marché, puis une opportunité.`],endings:[()=>`Vingt ans plus tard, les enfants nés après le basculement trouvent étrange que leurs parents aient autrefois vécu autrement. Le monde n'a pas simplement remplacé une technologie : il a changé ses habitudes.`,()=>`La technologie initialement perdue finit par laisser une empreinte inattendue. Certaines choses reviennent, d'autres disparaissent pour toujours.`]},
    science:{open:[()=>`La première différence apparaît dans les observations. Les scientifiques répètent les mesures, changent les instruments, recommencent. Les résultats restent les mêmes.`,()=>`Au début, le changement paraît impossible. Puis les données s'accumulent et une conclusion s'impose : dans cette réalité, une règle que nous considérions comme acquise fonctionne autrement.`],turns:[()=>`Les conséquences ne sont pas immédiates partout. Certaines régions ne remarquent presque rien, tandis que d'autres voient leurs habitudes bouleversées. Les chercheurs commencent alors à comprendre que le vrai changement est plus profond que prévu.`,()=>`Une découverte entraîne une autre. Des technologies deviennent possibles, des anciennes méthodes deviennent inutiles et une nouvelle génération de chercheurs se met à travailler sur des questions qui n'existaient pas auparavant.`],endings:[()=>`Des décennies plus tard, les manuels scolaires ont changé. Les élèves apprennent comme une évidence ce qui, pour les premiers scientifiques de cette réalité, semblait impossible.`,()=>`Le plus étrange est peut-être que personne ne peut dire où cette nouvelle règle s'arrêtera. Le monde a simplement ouvert une porte qui n'existait pas dans le nôtre.`]},
    eco:{open:[()=>`Au début, la nature ne fait rien de spectaculaire. Un changement se produit dans un endroit précis, puis un autre. Les premiers observateurs ne voient qu'une série de petites anomalies.`,()=>`Le premier signe est presque insignifiant : une espèce devient plus nombreuse, une autre recule. Puis les deux phénomènes commencent à se répondre.`],turns:[()=>`La chaîne s'étend. Ce qui semblait local atteint l'agriculture, les villes et les habitudes quotidiennes. Les humains comprennent alors qu'un écosystème n'est pas une collection de pièces séparées.`,()=>`Certaines espèces profitent du changement. D'autres disparaissent de régions entières. Les populations humaines adaptent leurs pratiques, parfois volontairement, parfois après avoir été forcées de le faire.`],endings:[()=>`Une génération plus tard, les paysages ont changé. Les cartes anciennes existent toujours, mais elles décrivent un monde que les enfants connaissent à peine.`,()=>`La nature n'a pas gagné ou perdu. Elle a simplement trouvé un nouvel équilibre, et les humains ont dû apprendre à vivre à l'intérieur de celui-ci.`]},
    economy:{open:[()=>`Le premier choc apparaît dans les chiffres, mais personne ne vit dans les chiffres. Derrière eux, il y a des magasins, des salaires, des familles et des entreprises qui découvrent soudain que leurs plans ne valent plus autant qu'hier.`,()=>`Les marchés réagissent avant même que la plupart des gens comprennent pourquoi. Puis les informations arrivent, les rumeurs se multiplient et les premières décisions deviennent irréversibles.`],turns:[()=>`Certaines entreprises disparaissent. D'autres comprennent immédiatement ce qui vient de changer et grandissent à une vitesse inattendue. Pour les familles, le problème est plus simple : il faut continuer à vivre pendant que le monde économique se réorganise.`,()=>`Quelques années plus tard, une nouvelle génération d'entreprises apparaît. Elles n'auraient probablement jamais existé dans l'ancien monde.`],endings:[()=>`Dix ans plus tard, les économistes parlent d'une nouvelle époque. Pour les personnes qui ont vécu le début de la crise, cette expression paraît presque trop propre pour décrire ce qu'elles ont traversé.`,()=>`L'économie finit par retrouver un équilibre, mais pas le même. Les gagnants et les perdants ont changé, et certaines habitudes ne reviendront jamais.`]},
    society:{open:[()=>`Le premier changement est humain. Les gens parlent, hésitent, se réunissent, se disputent. Une société ne change jamais d'un seul mouvement : elle change parce que des millions de personnes prennent de petites décisions différentes.`,()=>`Au début, les institutions pensent pouvoir gérer la situation comme un événement temporaire. Puis elles comprennent que le problème n'est pas temporaire : les règles elles-mêmes doivent évoluer.`],turns:[()=>`Les rues changent avant les textes de loi. De nouvelles habitudes apparaissent, puis les institutions tentent de les rattraper. Certains acceptent rapidement le nouveau monde ; d'autres refusent de perdre celui qu'ils connaissaient.`,()=>`Une génération grandit sans avoir connu l'ancien ordre. Elle ne le regrette pas nécessairement, parce qu'elle ne l'a jamais vécu. C'est souvent ainsi que les changements historiques deviennent permanents.`],endings:[()=>`Des décennies plus tard, les débats du premier jour semblent presque étranges. La société a conservé certaines choses, rejeté d'autres et transformé le reste.`,()=>`Le nouveau monde n'est ni parfait ni catastrophique. Il est simplement devenu normal pour ceux qui y vivent.`]},
    life:{open:[()=>`Dans cette réalité, tout commence par une décision personnelle. Elle paraît petite au moment où elle est prise, mais elle déplace progressivement tout le reste : les rencontres, les habitudes, les occasions et les renoncements.`,()=>`Le matin où tout commence, rien n'annonce encore la suite. La personne qui prend cette décision pense simplement essayer quelque chose. Elle ignore que son futur est en train de se diviser en deux chemins.`],turns:[()=>`Une première conséquence arrive. Puis une autre. Certaines sont heureuses, d'autres beaucoup moins. Le plus étrange est que les deux chemins restent plausibles pendant longtemps.`,()=>`À mesure que les années passent, les choix précédents deviennent difficiles à annuler. Une nouvelle vie se construit, morceau par morceau.`],endings:[()=>`Des années plus tard, une question revient parfois : était-ce vraiment le premier choix qui avait tout changé, ou toutes les petites décisions qui ont suivi ?`,()=>`La vie alternative ne ressemble finalement pas à un destin magique. Elle ressemble à une vie : pleine de hasard, de travail, de pertes, de rencontres et de secondes chances.`]},
    general:{open:[()=>`Tout commence au moment précis où la réalité cesse d'être celle que nous connaissons. Une seule hypothèse change, et le monde doit maintenant trouver une nouvelle manière de continuer.`,()=>`Personne ne reçoit de manuel pour cette nouvelle réalité. Les premières personnes confrontées au changement font simplement ce que font les humains : elles observent, elles essaient, elles se trompent et elles recommencent.`],turns:[()=>`La première conséquence en entraîne une deuxième. Puis une troisième. Le changement devient suffisamment important pour que les gens cessent de parler d'un incident et commencent à parler d'une nouvelle époque.`,()=>`Des années passent. Les enfants nés après le changement trouvent normal ce que leurs parents trouvaient impossible. C'est à ce moment que l'on comprend que le scénario a réellement changé le monde.`],endings:[()=>`Avec le temps, les traces du monde d'origine deviennent difficiles à reconnaître. Une seule hypothèse avait suffi à lancer une histoire complètement différente.`,()=>`Et pourtant, tout aurait pu basculer autrement. Dans une autre branche de cette réalité, une seule décision aurait encore changé la suite.`]}
  };

  function scene(kind,q,i,seed){
    const v=voices[kind]||voices.general, s=subject(q)||'cette réalité';
    const phase=i<2?'open':i>7?'endings':'turns';
    const arr=v[phase]||v.turns;
    return pick(arr,seed+i)(s);
  }

  function buildTimeline(kind){
    const base={person:['La naissance','L’enfance','Le premier tournant','La première occasion','Le choix qui change la carrière','Le moment de bascule','La célébrité','Le prix du succès','Des années plus tard','Épilogue'],extinction:['Le dernier jour','Les premières heures','La première semaine','Le premier mois','La première année','Dix ans plus tard','Un siècle plus tard','Cinq siècles plus tard','Mille ans plus tard','Épilogue'],history:['Le point de divergence','Le lendemain','La première victoire','Le prix de la victoire','La nouvelle carte','Une génération','Vingt ans plus tard','Un siècle plus tard','La mémoire du monde','Épilogue'],tech:['Le basculement','Les premières heures','La première semaine','Le premier mois','La première crise','La réaction du monde','La nouvelle génération','Vingt ans plus tard','Le nouvel équilibre','Épilogue'],science:['La découverte','La première preuve','Le premier hiver','La réaction du monde','L’adaptation','La nouvelle science','Une génération','Un siècle','Les conséquences lointaines','Épilogue'],eco:['Le premier signe','La chaîne commence','La première crise','L’adaptation','Le nouveau marché','Les gagnants','Les perdants','Une génération','Le nouvel équilibre','Épilogue'],economy:['Le choc','La première semaine','Les marchés','Les entreprises','Les familles','La crise','La nouvelle économie','Une génération','Le nouvel équilibre','Épilogue'],society:['Le premier jour','La première réaction','Les institutions','La rue','La nouvelle règle','La résistance','Une génération','Vingt ans plus tard','La nouvelle normalité','Épilogue'],life:['Le jour 1','La première semaine','Le premier choix','La première conséquence','La rencontre','Le tournant','La réussite','Le doute','Des années plus tard','Épilogue'],general:['Le point de départ','Le lendemain','La première conséquence','La réaction','Le détail inattendu','Le choix','La nouvelle trajectoire','Une génération','Le monde transformé','Épilogue']};return base[kind]||base.general}

  function renderFacts(real,kind,q){
    const facts=[];
    if(real){facts.push(`<div class="fact"><b>Contexte consulté</b>${esc(real.title)}</div><div class="fact"><b>Point de départ</b>${esc(real.snippet)}</div>`)}
    facts.push(`<div class="fact"><b>Nature</b>Réalité alternative / fiction</div>`);
    facts.push(`<div class="fact"><b>Trajectoire</b>${kind==='person'?'Vie et carrière':kind==='extinction'?'Civilisation et monde vivant':kind==='history'?'Histoire alternative':'Évolution du monde'}</div>`);
    return `<div class="facts">${facts.join('')}</div>`;
  }

  async function run(){
    const q=clean($('prompt').value); if(!q){$('prompt').focus();return}
    const seed=hash(q+mode); const kind=classify(q); current={q,kind,seed,mode};
    $('status').innerHTML='<span class="spinner"></span>Recherche du réel…';
    $('story').innerHTML=`<div class="cover"><div class="label">Construction</div><h2>Une autre réalité se prépare.</h2><p class="loading">Je vérifie d'abord le point de départ réel quand il est identifiable. Ensuite, l'histoire diverge.</p></div>`;
    const real=await reality(q); current.real=real;
    $('status').innerHTML='<span class="spinner"></span>Écriture…';
    const timeline=buildTimeline(kind); const count=mode==='epic'?16:10;
    let html=`<div class="cover"><div class="label">FICTION — ${kind.toUpperCase()}</div><h2>${esc(q)}</h2><p>Nous partons du monde réel, puis une seule hypothèse fait bifurquer l'histoire. Les événements qui suivent sont imaginaires : ils ne prétendent pas raconter ce qui s'est réellement produit.</p>${renderFacts(real,kind,q)}</div>`;
    for(let i=0;i<count;i++){
      await wait(18);
      const title=timeline[i%timeline.length];
      const p1=scene(kind,q,i,seed); const p2=scene(kind,q,i+3,seed+17); const p3=scene(kind,q,i+6,seed+31);
      html+=`<article class="chapter"><div class="label">${esc(title)}</div><h2>${esc(title)}</h2><p>${esc(p1)}</p><p>${esc(p2)}</p><p>${esc(p3)}</p></article>`;
      if(i===Math.floor(count*.58)) html+=`<div class="choice"><h3>À cet instant, l'histoire peut bifurquer.</h3><p class="note">Ce choix est narratif : il crée une autre branche de la fiction.</p><button class="button" data-choice="1">Continuer sans intervenir</button><button class="button" data-choice="2">Forcer un tournant inattendu</button><button class="button" data-choice="3">Revenir au début et changer l'hypothèse</button></div>`;
    }
    html+=`<div class="actions"><button class="button primary" id="again">↻ Rejouer cette réalité</button><button class="button" id="share">↗ Partager cette histoire</button><button class="button" id="copy">Copier le texte</button></div>`;
    if(real)html+=`<div class="sources"><div class="label">Point de départ réel</div><p class="note">Le Web a servi uniquement à contextualiser le scénario. La suite est une fiction.</p><div class="source"><a target="_blank" rel="noopener" href="https://fr.wikipedia.org/wiki/${encodeURIComponent(real.title.replace(/ /g,'_'))}">${esc(real.title)} — Wikipédia</a></div></div>`;
    $('story').innerHTML=html; $('status').textContent='Prêt'; $('story').scrollIntoView({behavior:'smooth',block:'start'});
    $('again').onclick=run;
    $('share').onclick=shareStory;
    $('copy').onclick=()=>navigator.clipboard?.writeText($('story').innerText).then(()=>{$('status').textContent='Copié'});
    document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{ $('prompt').value=current.q+' — '+(b.dataset.choice==='2'?'dans cette version, un tournant inattendu survient':'en conservant la trajectoire précédente'); run(); });
    saveHistory(current);
  }

  function saveHistory(x){try{const a=JSON.parse(localStorage.getItem('et-si-history')||'[]');a.unshift({q:x.q,kind:x.kind,at:Date.now()});localStorage.setItem('et-si-history',JSON.stringify(a.slice(0,30)))}catch(e){}}
  async function shareStory(){const text=$('story').innerText.slice(0,2500);if(navigator.share){try{await navigator.share({title:'Et si ? — réalité alternative',text,url:location.href})}catch(e){}}else{await navigator.clipboard?.writeText(location.href);$('status').textContent='Lien copié'}}
  document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode});
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('prompt').value=b.textContent;run()});
  $('go').onclick=run; $('clear').onclick=()=>{$('prompt').value='';$('story').innerHTML='';$('status').textContent='Prêt';$('prompt').focus()};
  $('prompt').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')run()});
})();
</script>
</body>
</html>
