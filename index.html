<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Et si ?</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#f4f0e8;font-family:system-ui,sans-serif}.app{max-width:1100px;margin:auto;padding:18px}.top,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top{justify-content:space-between}.logo{font-weight:900;letter-spacing:.2em;color:#e8bd61}.btn{border:1px solid #303846;background:#111721;color:#eee;border-radius:12px;padding:10px 14px;cursor:pointer}.btn:hover{border-color:#e8bd61}.primary{background:#e8bd61;color:#111;font-weight:900}.hero{text-align:center;padding:48px 10px 28px}.hero h1{font:900 clamp(58px,11vw,110px)/.85 Georgia;margin:0}.hero p{color:#aeb6c2}.composer,.story,.drawer{background:#10151e;border:1px solid #2c3542;border-radius:22px}.composer{padding:18px}.prompt{width:100%;min-height:150px;background:#080b10;color:#fff;border:1px solid #394352;border-radius:15px;padding:17px;font:19px/1.5 Georgia;resize:vertical}.status{margin-left:auto;color:#9ba5b3}.mode.active{border-color:#e8bd61;color:#e8bd61}.examples{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.workspace{margin-top:22px}.head{padding:30px}.tag{font-size:11px;font-weight:900;letter-spacing:.15em;color:#e8bd61}.story h2{font:800 clamp(34px,6vw,62px)/1.05 Georgia;margin:10px 0}.intro{color:#abb3bf;line-height:1.75}.page{padding:45px 9%;border-top:1px solid #2b3340}.page h3{font:800 28px Georgia}.para{font:18px/1.9 Georgia;color:#eae5dc;margin:0 0 15px;white-space:pre-wrap}.toolbar{padding:18px;border-top:1px solid #2b3340}.drawer{position:fixed;right:14px;top:14px;width:min(520px,calc(100% - 28px));max-height:92vh;overflow:auto;padding:18px;z-index:20}.hidden{display:none}.save{border:1px solid #303846;border-radius:12px;padding:12px;margin:8px 0}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#f4f0e8;color:#111;padding:10px 15px;border-radius:10px;font-weight:800;z-index:30}.bar{height:4px;background:#1d2530;margin-top:12px;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#e8bd61}.diag{white-space:pre-wrap;background:#0b1017;border:1px solid #27303d;border-radius:14px;padding:14px;font:12px monospace;color:#aeb6c2}.settings{margin-top:12px}.settings input{flex:1;min-width:260px;background:#080b10;color:#fff;border:1px solid #394352;border-radius:10px;padding:10px}.small{font-size:12px;color:#9ba5b3}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="logo">ET SI ?</div><nav class="row"><button class="btn" id="history">Mes histoires</button><button class="btn" id="help">Aide</button><button class="btn" id="diag">Diagnostic</button><button class="btn" id="shareApp">Partager l'application</button></nav></header>
<section class="hero"><h1>Et si…</h1><p>Une autre réalité, une autre histoire, une autre possibilité.</p></section>
<section class="composer">
<textarea id="prompt" class="prompt" maxlength="6000" placeholder="Et si Beyoncé était blanche ?"></textarea>
<div class="row" style="margin-top:12px"><button class="btn primary" id="go">▶ Lancer</button><button class="btn mode active" data-mode="Long">Long</button><button class="btn mode" data-mode="Épique">Épique</button><button class="btn mode" data-mode="Film">Film</button><button class="btn" id="new">Nouvelle</button><button class="btn" id="stop">Arrêter</button><span id="status" class="status">Prêt</span></div>
<div class="bar"><i id="bar"></i></div>
<div class="settings row"><input id="api" value="https://etsi-ai.onrender.com" aria-label="Serveur IA"><button class="btn" id="saveApi">Enregistrer le serveur</button><button class="btn" id="testApi">Tester l'IA</button></div>
<div class="small" style="margin-top:8px">Chaque question est traitée indépendamment : l'historique d'une génération n'est jamais renvoyé à la suivante.</div>
</section>
<div class="examples"><button class="btn chip">Et si Beyoncé était blanche ?</button><button class="btn chip">Et si les humains disparaissaient ?</button><button class="btn chip">Et si Napoléon gagnait Waterloo ?</button><button class="btn chip">Raconte-moi l'histoire de la Chine.</button><button class="btn chip">Pourquoi y a-t-il des séismes en Chine ?</button></div>
<section id="workspace" class="workspace"><article class="story"><div class="head"><div class="tag">ET SI ?</div><h2>Prêt.</h2><p class="intro">Écris une demande. Le site l'enverra au moteur IA du serveur.</p></div></article></section>
</main>
<aside id="drawer" class="drawer hidden"><div class="row" style="justify-content:space-between"><h3>Mes histoires</h3><button class="btn" id="close">Fermer</button></div><div id="saved"></div><div class="row"><button class="btn" id="clear">Supprimer tout</button><button class="btn" id="downloadHistory">Télécharger l'historique</button></div></aside>
<div id="toast" class="toast hidden"></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);const promptEl=$('prompt'),workspace=$('workspace'),statusEl=$('status'),bar=$('bar');
const KEY='etsi_history_v12',APIKEY='etsi_api_v12';let mode='Long',busy=false,stop=false,current=null;
function toast(t){const x=$('toast');x.textContent=t;x.classList.remove('hidden');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.add('hidden'),3000)}
function setStatus(t,n){statusEl.textContent=t;bar.style.width=Math.max(0,Math.min(100,n||0))+'%'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function api(){return($('api').value||'').trim().replace(/\/$/,'')}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function store(a){localStorage.setItem(KEY,JSON.stringify(a))}
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function classify(q){const s=q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();if(/\bet si\b|imagine|supposons|dans une autre realite/.test(s))return'Réalité alternative';if(/^(pourquoi|comment|qu'est-ce|quelle|quel|qui\b)/.test(s))return'Information';if(/raconte|histoire|roman|chronologie/.test(s))return'Récit';return'Conversation'}
async function research(q){const clean=q.replace(/\bet si\b/ig,'').replace(/[?!.]/g,' ').trim();const terms=clean.split(/\s+/).filter(x=>x.length>2);for(const title of[terms.slice(0,5).join(' '),terms.slice(0,3).join(' ')].filter(Boolean)){try{const r=await fetch('https://fr.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title));if(r.ok){const j=await r.json();if(j.extract)return j}}catch(e){}}return null}
function textOf(){return[...document.querySelectorAll('.para')].map(x=>x.textContent).join('\n\n')}
function splitChapters(text){const raw=String(text||'').trim();if(!raw)return[];const parts=raw.split(/(?=CHAPITRE\s*[—-])/i).map(x=>x.trim()).filter(Boolean);if(parts.length===1)return[{text:raw,title:'Réponse'}];return parts.map(x=>{const m=x.match(/^CHAPITRE\s*[—-]\s*([^\n]+)/i);return{text:m?x.slice(m[0].length).trim():x,title:m?m[1].trim():'Chapitre'}})}
function render(title,kind,chapters,context){let html='<article class="story"><div class="head"><div class="tag">'+esc(kind)+'</div><h2>'+esc(title)+'</h2><p class="intro">'+esc(context?'Contexte réel consulté avant la génération.':'Réponse produite par le moteur IA.')+'</p>'+(context?'<div class="diag"><b>'+esc(context.title||'')+'</b>\n'+esc((context.extract||'').slice(0,1400))+'</div>':'')+'</div>';chapters.forEach((c,i)=>{html+='<article class="page"><h3>'+esc(c.title||('Chapitre '+(i+1)))+'</h3>'+esc(c.text||'').split(/\n+/).filter(Boolean).map(x=>'<p class="para">'+x+'</p>').join('')+'</article>'});html+='<div class="toolbar row"><button class="btn" id="saveStory">Enregistrer</button><button class="btn" id="copyStory">Copier</button><button class="btn" id="downloadStory">Télécharger TXT</button><button class="btn" id="downloadJson">Télécharger JSON</button><button class="btn" id="shareStory">Partager</button><button class="btn" id="printStory">Imprimer</button><button class="btn" id="deleteStory">Supprimer</button></div></article>';workspace.innerHTML=html;bindStory()}
function bindStory(){
$('saveStory').onclick=()=>{const a=load();a.unshift({...current,chapters:[...document.querySelectorAll('.page')].map(p=>({title:p.querySelector('h3')?.textContent||'',text:[...p.querySelectorAll('.para')].map(x=>x.textContent).join('\n')})),date:new Date().toLocaleString('fr-FR')});store(a.slice(0,50));toast('Histoire enregistrée')};
$('copyStory').onclick=async()=>{try{await navigator.clipboard.writeText(textOf());toast('Copié')}catch(e){toast('Copie indisponible')}};
$('downloadStory').onclick=()=>download((current?.title||'et-si').replace(/[^\wÀ-ÿ -]/g,'')+'.txt',textOf(),'text/plain');
$('downloadJson').onclick=()=>download('et-si.json',JSON.stringify(current||{},null,2),'application/json');
$('shareStory').onclick=async()=>{try{if(navigator.share)await navigator.share({title:current?.title||'Et si ?',text:textOf()});else{await navigator.clipboard.writeText(textOf());toast('Texte copié')}}catch(e){}};
$('printStory').onclick=()=>window.print();$('deleteStory').onclick=()=>{workspace.innerHTML='<article class="story"><div class="head"><h2>Histoire supprimée.</h2></div></article>';current=null;toast('Supprimée')};
}
async function callAI(prompt,context){const r=await fetch(api()+'/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:String(prompt).slice(0,6000),context:String(context||'').slice(0,2000),mode})});let j={};try{j=await r.json()}catch(e){}if(!r.ok||!j.ok)throw new Error(j.detail||j.error||('HTTP '+r.status));return j.text||''}
function baseInstruction(q,kind,context){return 'Tu es le moteur narratif de Et Si ?. Réponds en français. Type: '+kind+'. Demande exacte: '+q+'\nContexte réel fourni: '+(context||'aucun')+'\nRègles: reste exactement sur le sujet; pour une réalité alternative, pars de la réalité connue puis choisis un point de divergence clair; crée des personnages nommés seulement si nécessaire; donne des scènes concrètes, dialogues, motivations, décisions et conséquences; ne répète aucune scène; ne transforme jamais les mots de la demande en nom de personnage; ne prétends jamais qu’une invention est un fait réel; écris comme un véritable récit, pas comme une explication mécanique.'}
async function generate(){if(busy)return;const q=promptEl.value.trim().slice(0,6000);if(!q){toast('Écris une demande.');promptEl.focus();return}busy=true;stop=false;current={query:q,title:q,mode,type:classify(q)};try{setStatus('Vérification du serveur…',5);const h=await fetch(api()+'/health');if(!h.ok)throw new Error('Serveur inaccessible');const kind=current.type;const info=kind==='Information'||kind==='Récit'||kind==='Réalité alternative'?await research(q):null;const context=info?info.title+'\n'+info.extract:'';setStatus('Génération…',35);const instruction=baseInstruction(q,kind,context)+'\nProduis toute la réponse en une seule génération. Pour une réalité alternative, développe plusieurs chapitres avec des conséquences qui avancent dans le temps. Ne recommence pas l’histoire entre les chapitres.';const t=await callAI(instruction,context);if(stop)return;render(q,kind,splitChapters(t),info);setStatus('Terminé',100)}catch(e){console.error(e);toast('Erreur : '+e.message);setStatus('Erreur',0)}finally{busy=false}}
async function testApi(){try{setStatus('Test…',20);const r=await fetch(api()+'/health');const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Serveur indisponible');toast('IA opérationnelle : '+(j.model||'OK'));setStatus('Serveur OK',100)}catch(e){toast('Erreur serveur : '+e.message);setStatus('Erreur',0)}}
function showHistory(){const a=load();$('saved').innerHTML=a.length?a.map((x,i)=>'<div class="save"><b>'+esc(x.title||x.query)+'</b><div class="small">'+esc(x.date||'')+'</div><div class="row"><button class="btn open" data-i="'+i+'">Ouvrir</button><button class="btn del" data-i="'+i+'">Supprimer</button></div></div>').join(''):'<p>Aucune histoire.</p>';$('drawer').classList.remove('hidden');document.querySelectorAll('.open').forEach(b=>b.onclick=()=>{const x=load()[+b.dataset.i];current=x;promptEl.value=x.query||'';render(x.title||x.query,x.type||'Histoire',x.chapters||[],null);$('drawer').classList.add('hidden')});document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{const a=load();a.splice(+b.dataset.i,1);store(a);showHistory()})}
$('go').onclick=generate;$('stop').onclick=()=>{stop=true;toast('Arrêt demandé')};$('new').onclick=()=>{promptEl.value='';current=null;workspace.innerHTML='<article class="story"><div class="head"><div class="tag">ET SI ?</div><h2>Prêt.</h2><p class="intro">Écris une nouvelle demande.</p></div></article>';setStatus('Prêt',0)};
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');toast('Mode '+mode)});
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{promptEl.value=b.textContent;promptEl.focus()});$('history').onclick=showHistory;$('close').onclick=()=>$('drawer').classList.add('hidden');$('clear').onclick=()=>{if(confirm('Supprimer tout l’historique ?')){store([]);showHistory()}};$('downloadHistory').onclick=()=>download('mes-histoires.json',JSON.stringify(load(),null,2),'application/json');$('saveApi').onclick=()=>{localStorage.setItem(APIKEY,api());toast('Serveur enregistré')};$('testApi').onclick=testApi;$('api').value=localStorage.getItem(APIKEY)||$('api').value;$('help').onclick=()=>toast('Écris une question puis clique sur Lancer. Une nouvelle question peut être envoyée immédiatement après la précédente.');$('shareApp').onclick=async()=>{try{if(navigator.share)await navigator.share({title:'Et si ?',url:location.href});else{await navigator.clipboard.writeText(location.href);toast('Lien copié')}}catch(e){}};$('diag').onclick=async()=>{try{const r=await fetch(api()+'/health');const j=await r.json();alert(JSON.stringify(j,null,2))}catch(e){alert('Serveur inaccessible : '+e.message)}};
})();
</script>
</body></html>
