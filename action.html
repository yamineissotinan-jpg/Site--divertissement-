<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludivia — NEXUS : survie</title>
<meta name="description" content="NEXUS, un jeu d'action original de survie dans une arène futuriste. Esquive, dash et bats ton record.">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050713;color:#f7f8ff;font-family:Inter,system-ui,sans-serif}body{display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 50% 10%,#1b2350,transparent 45%),#050713}.wrap{width:min(1050px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.brand{font-size:25px;font-weight:950}.brand span{color:#22d3ee}.hint{color:#9ca9c8;font-size:13px}.hud{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:8px 12px;border:1px solid #283452;background:#0d1325;border-radius:999px}.pill b{color:#fff}.arena{position:relative;width:100%;aspect-ratio:16/9;max-height:680px;overflow:hidden;border:1px solid #334263;border-radius:24px;background:radial-gradient(circle at 50% 50%,#151d3b,#080b17 65%);box-shadow:0 30px 90px #000b;touch-action:none}.arena:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#26365c33 1px,transparent 1px),linear-gradient(90deg,#26365c33 1px,transparent 1px);background-size:50px 50px;transform:perspective(500px) rotateX(60deg) scale(1.8) translateY(100px);transform-origin:center bottom}.arena:after{content:"";position:absolute;inset:12%;border:1px solid #22d3ee20;border-radius:50%;box-shadow:0 0 100px #22d3ee0b}.player{position:absolute;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#a78bfa,#22d3ee);box-shadow:0 0 25px #22d3ee99;z-index:4;transform:translate(-50%,-50%)}.player:after{content:"";position:absolute;inset:7px;border-radius:6px;background:#fff9}.enemy{position:absolute;width:26px;height:26px;background:#fb7185;border-radius:8px;box-shadow:0 0 22px #fb718599;z-index:3;transform:translate(-50%,-50%)}.bullet{position:absolute;width:9px;height:9px;border-radius:50%;background:#fbbf24;box-shadow:0 0 14px #fbbf24;z-index:3;transform:translate(-50%,-50%)}.orb{position:absolute;width:18px;height:18px;border-radius:50%;background:#34d399;box-shadow:0 0 25px #34d399;z-index:2;transform:translate(-50%,-50%)}.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#050713aa;backdrop-filter:blur(5px);z-index:10}.card{width:min(560px,90%);text-align:center;padding:30px;border:1px solid #334263;border-radius:24px;background:#0b1020ee}.card h1{font-size:clamp(34px,7vw,68px);margin:0 0 10px;letter-spacing:-3px}.card p{color:#aab5d0;line-height:1.6}.btn{border:0;border-radius:14px;padding:14px 20px;background:linear-gradient(135deg,#8b5cf6,#22d3ee);color:#fff;font-weight:900;cursor:pointer;box-shadow:0 12px 30px #22d3ee22}.controls{display:none;grid-template-columns:repeat(3,65px);grid-template-rows:repeat(2,65px);gap:7px;margin:12px auto 0;width:max-content}.ctrl{border:1px solid #344365;background:#121a2e;color:#fff;border-radius:15px;font-size:22px}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.mobile{display:flex;gap:10px;justify-content:center;margin-top:10px}.dash{padding:10px 16px;border:1px solid #344365;background:#121a2e;color:#fff;border-radius:12px;font-weight:800}.progress{height:7px;background:#1a2440;border-radius:99px;margin-top:12px;overflow:hidden}.progress span{display:block;height:100%;width:100%;background:linear-gradient(90deg,#22d3ee,#8b5cf6)}@media(max-width:700px){.controls{display:grid}.hint{display:none}.arena{aspect-ratio:4/5;max-height:70vh}}
</style></head>
<body><div class="wrap"><header><div><div class="brand">Ludi<span>via</span> / NEXUS</div><div class="hint">Survie originale · clavier ou commandes tactiles</div></div><div class="hud"><div class="pill">Score <b id="score">0</b></div><div class="pill">Vague <b id="wave">1</b></div><div class="pill">❤ <b id="life">3</b></div></div></header>
<div class="arena" id="arena"><div class="flash" id="flash"></div><div class="overlay" id="menu"><div class="card"><div style="font-size:12px;color:#22d3ee;font-weight:900;letter-spacing:.16em">LUDIVIA ORIGINAL</div><h1>NEXUS</h1><p>Survis dans l'arène. Déplace-toi, esquive les ennemis et récupère les orbes d'énergie. La vitesse augmente à chaque vague.</p><button class="btn" id="start">LANCER LA PARTIE</button></div></div></div>
<div class="progress"><span id="timebar"></span></div><div class="controls"><button class="ctrl up" data-k="ArrowUp">▲</button><button class="ctrl left" data-k="ArrowLeft">◀</button><button class="ctrl down" data-k="ArrowDown">▼</button><button class="ctrl right" data-k="ArrowRight">▶</button></div><div class="mobile"><button class="dash" id="dash">⚡ DASH</button><a class="dash" href="./">← Retour</a></div></div>
<script>
(()=>{const A=document.getElementById('arena'),M=document.getElementById('menu'),S=document.getElementById('start'),D=document.getElementById('dash'),scoreEl=document.getElementById('score'),waveEl=document.getElementById('wave'),lifeEl=document.getElementById('life'),bar=document.getElementById('timebar'),flash=document.getElementById('flash');let p,e=[],o=[],b=[],keys={},running=false,last=0,spawn=0,orbT=0,score=0,wave=1,lives=3,px=.5,py=.5,dx=0,dy=0,dashT=0,lastHit=0;const W=()=>A.clientWidth,H=()=>A.clientHeight;function el(c,x,y){const q=document.createElement('div');q.className=c;q.style.left=x*100+'%';q.style.top=y*100+'%';A.appendChild(q);return q}function reset(){A.querySelectorAll('.player,.enemy,.orb,.bullet').forEach(x=>x.remove());p=el('player',px,py);e=[];o=[];b=[];score=0;wave=1;lives=3;px=.5;py=.5;scoreEl.textContent=0;waveEl.textContent=1;lifeEl.textContent=3;lastHit=0}function start(){reset();M.style.display='none';running=true;last=performance.now();requestAnimationFrame(loop)}function spawnEnemy(){const side=Math.floor(Math.random()*4),m=.03;let x,y;if(side===0){x=Math.random();y=m}else if(side===1){x=1-m;y=Math.random()}else if(side===2){x=Math.random();y=1-m}else{x=m;y=Math.random()}e.push({x,y,v:.035+wave*.004,n:el('enemy',x,y)})}function spawnOrb(){const x=.12+Math.random()*.76,y=.12+Math.random()*.76;o.push({x,y,n:el('orb',x,y)})}function hit(){const now=performance.now();if(now-lastHit<700)return;lastHit=now;lives--;lifeEl.textContent=lives;flash.style.opacity=.45;setTimeout(()=>flash.style.opacity=0,90);if(lives<=0)end()}function end(){running=false;M.style.display='grid';M.querySelector('.card').innerHTML='<div style="font-size:12px;color:#22d3ee;font-weight:900;letter-spacing:.16em">PARTIE TERMINÉE</div><h1>'+score+'</h1><p>Tu as atteint la vague <b>'+wave+'</b>. Essaie de battre ton record.</p><button class="btn" id="again">REJOUER</button>';document.getElementById('again').onclick=start}function loop(t){if(!running)return;const dt=Math.min(.033,(t-last)/1000);last=t;spawn+=dt;orbT+=dt;dashT=Math.max(0,dashT-dt);let vx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),vy=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);if(vx||vy){const z=Math.hypot(vx,vy);vx/=z;vy/=z;const sp=dashT?0.9:0.42;px+=vx*sp*dt;py+=vy*sp*dt}px=Math.max(.035,Math.min(.965,px));py=Math.max(.055,Math.min(.945,py));p.style.left=px*100+'%';p.style.top=py*100+'%';const maxE=Math.min(25,3+wave*2);if(spawn>Math.max(.35,1.15-wave*.07)&&e.length<maxE){spawn=0;spawnEnemy()}if(orbT>Math.max(2.5,5-wave*.12)&&o.length<2){orbT=0;spawnOrb()}for(const x of e){const ax=px-x.x,ay=py-x.y,z=Math.hypot(ax,ay)||1;x.x+=ax/z*x.v*dt*60;x.y+=ay/z*x.v*dt*60;x.n.style.left=x.x*100+'%';x.n.style.top=x.y*100+'%';if(Math.hypot(px-x.x,py-x.y)<.045)hit()}for(let i=o.length-1;i>=0;i--){const x=o[i];if(Math.hypot(px-x.x,py-x.y)<.055){score+=50+wave*10;scoreEl.textContent=score;x.n.remove();o.splice(i,1)}}if(t%1000<40){score+=Math.floor(dt*20);scoreEl.textContent=score}if(score>0&&score%500<20){wave=Math.max(wave,Math.floor(score/500)+1);waveEl.textContent=wave}bar.style.width=Math.max(0,100-(t%12000)/120)+'%';requestAnimationFrame(loop)}document.addEventListener('keydown',x=>{keys[x.key]=true;if(x.key===' '){x.preventDefault();dash()}});document.addEventListener('keyup',x=>keys[x.key]=false);document.querySelectorAll('.ctrl').forEach(x=>{x.onpointerdown=()=>keys[x.dataset.k]=true;x.onpointerup=x.onpointercancel=()=>keys[x.dataset.k]=false});function dash(){if(!running)return;dashT=.22}D.onclick=dash;S.onclick=start})();
</script></body></html>
