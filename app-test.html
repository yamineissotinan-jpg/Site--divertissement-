<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Et si ?</title><style>*{box-sizing:border-box}body{margin:0;background:#07090d;color:#f5f1e8;font-family:system-ui,sans-serif}.app{max-width:1100px;margin:auto;padding:18px}.top,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top{justify-content:space-between}.logo{font-weight:900;letter-spacing:.2em;color:#e8bd61}.btn,.chip{border:1px solid #303846;background:#111721;color:#eee;border-radius:12px;padding:10px 14px;cursor:pointer}.btn:hover,.chip:hover{border-color:#e8bd61}.primary{background:#e8bd61;color:#111;font-weight:900}.hero{text-align:center;padding:45px 10px 25px}.hero h1{font:900 clamp(58px,11vw,110px)/.85 Georgia;margin:0}.hero p,.small{color:#aeb6c2}.composer,.story,.drawer{background:#10151e;border:1px solid #2c3542;border-radius:22px}.composer{padding:18px}.prompt{width:100%;min-height:150px;background:#080b10;color:#fff;border:1px solid #394352;border-radius:15px;padding:17px;font:19px/1.5 Georgia;resize:vertical}.status{margin-left:auto;color:#9ba5b3}.active{border-color:#e8bd61;color:#e8bd61}.examples{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.workspace{margin-top:22px}.head{padding:30px}.tag{font-size:11px;font-weight:900;letter-spacing:.15em;color:#e8bd61}.story h2{font:800 clamp(34px,6vw,62px)/1.05 Georgia;margin:10px 0}.intro{color:#abb3bf;line-height:1.75}.page{padding:55px 9%;border-top:1px solid #2b3340}.page h3{font:800 31px Georgia}.para{font:18px/1.9 Georgia;color:#eae5dc;margin:0 0 15px}.toolbar{padding:18px;border-top:1px solid #2b3340}.drawer{position:fixed;right:14px;top:14px;width:min(500px,calc(100% - 28px));max-height:92vh;overflow:auto;padding:18px;z-index:20;box-shadow:0 20px 80px #000}.hidden{display:none}.save{border:1px solid #303846;border-radius:12px;padding:12px;margin:8px 0}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#f4f0e8;color:#111;padding:10px 15px;border-radius:10px;font-weight:800;z-index:30}.bar{height:4px;background:#1d2530;margin-top:12px;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#e8bd61}.diag{white-space:pre-wrap;background:#0b1017;border:1px solid #27303d;border-radius:14px;padding:14px;font:12px monospace;color:#aeb6c2}@media(max-width:650px){.page{padding:38px 5%}}</style></head><body><main class="app"><header class="top"><div class="logo">ET SI ?</div><nav class="row"><button class="btn" id="history">Mes histoires</button><button class="btn" id="help">Aide</button><button class="btn" id="diag">Diagnostic</button><button class="btn" id="shareApp">Partager l'application</button></nav></header><section class="hero"><h1>Et si…</h1><p>Imagine une autre réalité. Le moteur essaie de raisonner, mémoriser et raconter.</p></section><section class="composer"><textarea id="prompt" class="prompt" placeholder="Et si Beyoncé était blanche ?"></textarea><div class="row"><button class="btn primary" id="go">▶ Lancer</button><button class="btn mode active" data-mode="Long">Long</button><button class="btn mode" data-mode="Épique">Épique</button><button class="btn mode" data-mode="Film">Film</button><button class="btn" id="new">Nouvelle</button><button class="btn" id="stop">Arrêter</button><span id="status" class="status">Prêt</span></div><div class="bar"><i id="bar"></i></div></section><div class="examples"><button class="chip">Et si Beyoncé était blanche ?</button><button class="chip">Et si les humains disparaissaient ?</button><button class="chip">Et si Napoléon gagnait Waterloo ?</button><button class="chip">Raconte-moi l'histoire de la Chine.</button><button class="chip">Pourquoi y a-t-il des séismes en Chine ?</button></div><section id="workspace" class="workspace"><article class="story"><div class="head"><div class="tag">MOTEUR</div><h2>Prêt.</h2><p class="intro">Les boutons de l'interface fonctionnent sans dépendre du téléchargement du modèle. Le modèle local n'est chargé qu'après ton clic sur Lancer.</p></div></article></section></main><aside id="drawer" class="drawer hidden"><div class="row" style="justify-content:space-between"><h3>Mes histoires</h3><button class="btn" id="close">Fermer</button></div><div id="saved"></div><div class="row"><button class="btn" id="clear">Supprimer tout</button><button class="btn" id="downloadHistory">Télécharger l'historique</button></div></aside><div id="toast" class="toast hidden"></div><script>
(function(){
'use strict';
const $=id=>document.getElementById(id),p=$("prompt"),w=$("workspace"),st=$("status"),bar=$("bar");
let mode='Long',busy=false,stopRequested=false,current=null,pipe=null,lib=null;
const KEY='etsi_v8_history';
const toast=t=>{const x=$("toast");x.textContent=t;x.classList.remove('hidden');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.add('hidden'),3200)};
const status=(t,n)=>{st.textContent=t;bar.style.width=Math.max(0,Math.min(100,n||0))+'%'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}};
const save=a=>localStorage.setItem(KEY,JSON.stringify(a));
const textOf=()=>[...document.querySelectorAll('.para')].map(x=>x.textContent).join('\n\n');
function classify(q){const s=q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();if(/\bet si\b|imagine|supposons|dans une autre realite/.test(s))return 'REALITE_ALTERNATIVE';if(/^(pourquoi|comment|qu'est-ce|quelle|quel|qui\b)/.test(s))return 'INFORMATION';if(/raconte|histoire|roman|chronologie/.test(s))return 'RECIT';return 'CONVERSATION'}
function bindStory(){
$("saveStory").onclick=()=>{const a=load();a.unshift({...current,chapters:[...document.querySelectorAll('.page')].map(x=>({text:[...x.querySelectorAll('.para')].map(p=>p.textContent).join('\n')})),date:new Date().toLocaleString('fr-FR')});save(a.slice(0,50));toast('Enregistrée');};
$("copyStory").onclick=async()=>{try{await navigator.clipboard.writeText(textOf());toast('Copié')}catch(e){toast('Copie indisponible')}};
$("downloadStory").onclick=()=>downloadText(current&&current.title||'Et si',textOf(),'txt');
$("downloadJson").onclick=()=>downloadText('et-si',JSON.stringify(current||{},null,2),'json');
$("shareStory").onclick=async()=>{try{if(navigator.share){await navigator.share({title:current?.title||'Et si ?',text:textOf()})}else{await navigator.clipboard.writeText(textOf());toast('Texte copié')}}catch(e){}};
$("printStory").onclick=()=>window.print();
$("deleteStory").onclick=()=>{current=null;w.innerHTML='<article class="story"><div class="head"><h2>Supprimée.</h2></div></article>';toast('Supprimée')};
}
function render(title,intro,chapters,info){let html='<article class="story"><div class="head"><div class="tag">IA LOCALE · '+esc(current?.type||'SIMULATION')+'</div><h2>'+esc(title)+'</h2><p class="intro">'+esc(intro)+'</p>'+(info?'<div class="diag"><b>Contexte consulté</b>\n'+esc(info.title||'')+'\n\n'+esc((info.extract||'').slice(0,1200))+'</div>':'')+'</div>';chapters.forEach((c,i)=>{html+='<article class="page"><h3>Chapitre '+(i+1)+'</h3>'+String(c.text||'').split(/\n+/).filter(Boolean).map(x=>'<p class="para">'+esc(x)+'</p>').join('')+'</article>'});html+='<div class="toolbar row"><button class="btn" id="saveStory">Enregistrer</button><button class="btn" id="copyStory">Copier</button><button class="btn" id="downloadStory">Télécharger TXT</button><button class="btn" id="downloadJson">Télécharger JSON</button><button class="btn" id="shareStory">Partager</button><button class="btn" id="printStory">Imprimer</button><button class="btn" id="deleteStory">Supprimer</button></div></article>';w.innerHTML=html;bindStory()}
function downloadText(name,text,ext){const blob=new Blob([text],{type:ext==='json'?'application/json':'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(name||'et-si')+'.'+ext;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function loadAI(){if(pipe)return pipe;if(!navigator.onLine){toast('Internet est nécessaire pour le premier téléchargement du modèle.');return null}status('Chargement du moteur IA…',3);try{lib=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1/+esm');lib.env.allowLocalModels=false;lib.env.useBrowserCache=true;const models=['HuggingFaceTB/SmolLM2-360M-Instruct','HuggingFaceTB/SmolLM2-135M-Instruct'];const devices=navigator.gpu?['webgpu','wasm']:['wasm'];let last=null;for(const device of devices){for(const model of models){try{status('Téléchargement '+model.split('/').pop()+' · '+device,8);pipe=await lib.pipeline('text-generation',model,{device:device,dtype:device==='webgpu'?'q4':'q4',progress_callback:r=>{if(r&&r.status==='progress')status('Téléchargement · '+Math.round(r.progress||0)+'%',Math.round(r.progress||0))}});pipe.modelName=model;pipe.deviceName=device;status('IA prête · '+model.split('/').pop(),100);toast('Modèle chargé et mis en cache');return pipe}catch(e){last=e;pipe=null;console.error('Model failed',model,device,e)}}}throw last||new Error('Aucun modèle disponible')}catch(e){console.error(e);status('Modèle indisponible',0);toast('Le modèle n’a pas pu être chargé. Ouvre Diagnostic.');return null}}
function buildPrompt(type,q,context,memory){return 'Tu es Et Si ?, une petite IA narrative française. Type: '+type+'. Comprends la demande exactement. Pour une question factuelle, réponds factuellement. Pour un récit réel, raconte les faits sans inventer. Pour une REALITE_ALTERNATIVE, pars du contexte réel puis invente une trajectoire cohérente. Ne transforme jamais une demande en autre sujet. Ne répète pas les mêmes scènes. Utilise des personnages nommés, des motivations, des relations, des lieux, des dates et des conséquences. Chaque scène doit faire avancer l’histoire.\n\nDEMANDE:\n'+q+'\n\nCONTEXTE REEL:\n'+context+'\n\nMEMOIRE:\n'+memory;}
async function generateText(prompt,max){if(!pipe)throw new Error('Modèle non chargé');const out=await pipe(prompt,{max_new_tokens:max,temperature:.8,top_p:.9,repetition_penalty:1.12,do_sample:true});let g=out&&out[0]&&out[0].generated_text;if(typeof g==='string'&&g.indexOf(prompt)===0)g=g.slice(prompt.length);return Array.isArray(g)?(g[g.length-1]?.content||''):String(g||'').trim()}
async function research(q){const s=q.replace(/\bet si\b/ig,'').replace(/[?!.]/g,' ').replace(/\b(était|etait|avait|aurait|gagnait|disparaissaient)\b/ig,' ');const words=s.split(/\s+/).filter(x=>x.length>2);const tries=[words.slice(0,5).join(' '),words.slice(0,3).join(' ')].filter(Boolean);for(const title of tries){try{const r=await fetch('https://fr.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title));if(r.ok){const j=await r.json();if(j.extract)return j}}catch(e){}}return null}
async function generate(){if(busy)return;const q=p.value.trim();if(!q){toast('Écris une demande.');p.focus();return}busy=true;stopRequested=false;current={query:q,title:q,type:classify(q),mode};try{const ai=await loadAI();if(!ai)return;const type=current.type;status('Compréhension de la demande…',20);const info=type==='CONVERSATION'?null:await research(q);const context=info?info.title+'\n'+info.extract:'Aucun résultat externe fiable trouvé.';if(type!=='REALITE_ALTERNATIVE'){status('Génération…',55);const out=await generateText(buildPrompt(type,q,context,''),mode==='Film'?1100:850);if(!stopRequested)render(q,'Réponse générée par le modèle local.',[{text:out}],info)}else{const count=mode==='Long'?5:mode==='Épique'?6:7;const chapters=[];let memory='';for(let i=0;i<count;i++){if(stopRequested)break;status('Chapitre '+(i+1)+'/'+count,25+Math.round(i/count*70));const instruction=buildPrompt(type,q,context,memory)+'\n\nEcris le chapitre '+(i+1)+' en au moins 50 phrases distinctes. Commence exactement à partir de la mémoire. Ne recommence pas l’histoire. Fais des scènes concrètes, des dialogues, des décisions, des conflits et des conséquences. Termine sur une situation qui permet naturellement au chapitre suivant de commencer.';const out=await generateText(instruction,1450);chapters.push({text:out});memory+='\nCHAPITRE '+(i+1)+'\n'+out}if(!stopRequested)render(q,'Réalité alternative construite à partir du contexte consulté.',chapters,info)}status(stopRequested?'Arrêté':'Terminé',stopRequested?0:100)}catch(e){console.error(e);toast('Erreur: '+(e.message||e));status('Erreur',0)}finally{busy=false}}
function showHistory(){const a=load();$('saved').innerHTML=a.length?a.map((x,i)=>'<div class="save"><b>'+esc(x.title||x.query)+'</b><div class="small">'+esc(x.date||'')+'</div><div class="row"><button class="btn openSave" data-i="'+i+'">Ouvrir</button><button class="btn delSave" data-i="'+i+'">Supprimer</button></div></div>').join(''):'<p class="small">Aucune histoire enregistrée.</p>';$('drawer').classList.remove('hidden');document.querySelectorAll('.openSave').forEach(b=>b.onclick=()=>{const x=load()[+b.dataset.i];current=x;p.value=x.query||'';render(x.title||x.query,'Histoire enregistrée.',x.chapters||[],null);$('drawer').classList.add('hidden')});document.querySelectorAll('.delSave').forEach(b=>b.onclick=()=>{const a=load();a.splice(+b.dataset.i,1);save(a);showHistory()})}
function diagnostic(){const lines=['HTTPS: '+(location.protocol==='https:'?'oui':'non'),'Internet: '+(navigator.onLine?'oui':'non'),'WebGPU: '+(navigator.gpu?'détecté':'non détecté'),'WebAssembly: '+(typeof WebAssembly!=='undefined'?'oui':'non'),'Modèle: '+(pipe?pipe.modelName:'pas encore chargé'),'Exécution: '+(pipe?pipe.deviceName:'pas encore chargé'),'Transformers.js: '+(lib?'chargé':'pas encore chargé'),'Stockage local: oui'];w.innerHTML='<article class="story"><div class="head"><div class="tag">DIAGNOSTIC</div><h2>État du site</h2><div class="diag">'+esc(lines.join('\n'))+'</div><p class="intro">Le site peut fonctionner sans API payante. Le premier lancement doit toutefois télécharger le modèle depuis Hugging Face.</p></div></article>'}
$("go").onclick=generate;$("stop").onclick=()=>{if(busy){stopRequested=true;toast('Arrêt demandé…')}};$("history").onclick=showHistory;$("help").onclick=()=>toast('Écris une demande puis Lancer. Mes histoires conserve les récits.');$("diag").onclick=diagnostic;$("close").onclick=()=>$("drawer").classList.add('hidden');$("clear").onclick=()=>{if(confirm('Supprimer toutes les histoires ?')){save([]);showHistory();toast('Historique supprimé')}};$("downloadHistory").onclick=()=>downloadText('et-si-historique',JSON.stringify(load(),null,2),'json');$("new").onclick=()=>{p.value='';current=null;w.innerHTML='<article class="story"><div class="head"><div class="tag">MOTEUR</div><h2>Nouvelle demande.</h2><p class="intro">Écris ce que tu veux explorer.</p></div></article>';status(pipe?'IA prête':'Prêt',pipe?100:0)};$("shareApp").onclick=async()=>{const url=location.href;try{if(navigator.share)await navigator.share({title:'Et si ?',text:'Essaie Et si ?',url});else{await navigator.clipboard.writeText(url);toast('Lien de l’application copié')}}catch(e){}};document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;toast('Mode '+mode)});document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{p.value=b.textContent;p.focus()});p.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')generate()});
status('Prêt',0);
})();
</script></body></html>
