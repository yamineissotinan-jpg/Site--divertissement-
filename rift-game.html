<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIFT — Ludivia</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#05060b;color:#fff;font-family:system-ui}canvas{display:block}.ui{position:fixed;inset:0;pointer-events:none}.hud{display:flex;justify-content:space-between;padding:18px;font-weight:900;text-shadow:0 2px 10px #000}.panel{background:#07101dcc;border:1px solid #33415f;border-radius:14px;padding:10px 14px}.bar{width:180px;height:8px;background:#20283b;border-radius:9px;margin-top:6px;overflow:hidden}.bar span{display:block;height:100%;width:100%;background:#39e6a5}.help{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#07101dcc;border:1px solid #33415f;border-radius:14px;padding:10px 15px;color:#c4d0e8;font-size:13px}.start{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#172c55,#03050a 65%);z-index:4}.card{width:min(650px,88%);padding:40px;text-align:center;border:1px solid #3b4d72;border-radius:28px;background:#07101eee;box-shadow:0 35px 100px #000}.card h1{font-size:clamp(60px,12vw,120px);margin:0;letter-spacing:-.08em}.card p{color:#aab8d3;line-height:1.6}.btn{pointer-events:auto;padding:15px 25px;border:0;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#22d3ee);color:white;font-weight:950;font-size:15px}</style></head><body><div class="start" id="start"><div class="card"><small>LUDIVIA ORIGINAL</small><h1>RIFT</h1><p>Explore une zone 3D, contrôle ton personnage, affronte les sentinelles et découvre une première vraie boucle de combat.</p><button class="btn" id="play" type="button">JOUER</button></div></div><div class="ui"><div class="hud"><div class="panel">VITALITÉ<div class="bar"><span id="life"></span></div></div><div class="panel">SCORE <b id="score">0</b></div></div><div class="help">WASD · courir | ESPACE · esquive | SOURIS · caméra | CLIC · attaque</div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/loaders/GLTFLoader.js';
const start=document.getElementById('start'),play=document.getElementById('play'),life=document.getElementById('life'),scoreEl=document.getElementById('score');let scene,camera,renderer,clock,player,mixer,actions={},enemies=[],keys={},yaw=0,pitch=-.2,hp=100,score=0,lastAttack=0,running=false;
play.addEventListener('click',()=>{if(running)return;start.style.display='none';running=true;init().catch(err=>{console.error(err);start.style.display='grid';start.querySelector('p').textContent='Le moteur 3D n’a pas pu démarrer. Recharge la page puis réessaie.';running=false})});
async function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x050812);scene.fog=new THREE.Fog(0x050812,18,75);camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.05,150);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xbad8ff,0x10101d,2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(8,18,8);sun.castShadow=true;scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({color:0x101829,roughness:.9}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);for(let i=0;i<20;i++){const h=2+Math.random()*8,b=new THREE.Mesh(new THREE.BoxGeometry(2+Math.random()*5,h,2+Math.random()*5),new THREE.MeshStandardMaterial({color:0x18253b,metalness:.3,roughness:.7}));b.position.set((Math.random()-.5)*70,h/2,(Math.random()-.5)*70);b.castShadow=true;scene.add(b)}player=new THREE.Group();scene.add(player);const loader=new GLTFLoader();let loaded=false;try{const gltf=await new Promise((resolve,reject)=>loader.load('https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb',resolve,undefined,reject));const model=gltf.scene;model.scale.setScalar(1.05);model.traverse(o=>{if(o.isMesh)o.castShadow=true});player.add(model);mixer=new THREE.AnimationMixer(model);for(const clip of gltf.animations)actions[clip.name]=mixer.clipAction(clip);playAnim('Idle');loaded=true}catch(e){console.warn('Modèle 3D externe indisponible',e)}if(!loaded){const body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,.9,8,16),new THREE.MeshStandardMaterial({color:0x22d3ee,metalness:.4}));body.position.y=1;body.castShadow=true;player.add(body)}for(let i=0;i<7;i++)spawnEnemy();clock=new THREE.Clock();window.addEventListener('keydown',onKeyDown);window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);window.addEventListener('resize',resize);renderer.domElement.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.002;pitch=Math.max(-.7,Math.min(.35,pitch-e.movementY*.002))}});renderer.domElement.addEventListener('click',()=>attack());renderer.setAnimationLoop(loop)}
function onKeyDown(e){keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();dash()}}
function playAnim(name){const a=actions[name];if(!a)return;Object.values(actions).forEach(x=>x.stop());a.reset().fadeIn(.15).play()}
function spawnEnemy(){const e=new THREE.Mesh(new THREE.IcosahedronGeometry(.65,2),new THREE.MeshStandardMaterial({color:0xff426f,emissive:0x4a081d,emissiveIntensity:1.3}));e.position.set((Math.random()-.5)*55,.7,(Math.random()-.5)*55);e.castShadow=true;scene.add(e);enemies.push(e)}
function attack(){if(!renderer||performance.now()-lastAttack<400)return;lastAttack=performance.now();if(renderer.domElement.requestPointerLock)renderer.domElement.requestPointerLock();if(actions.Walking){playAnim('Walking');setTimeout(()=>playAnim('Idle'),300)}for(let i=enemies.length-1;i>=0;i--){if(enemies[i].position.distanceTo(player.position)<3){scene.remove(enemies[i]);enemies.splice(i,1);score+=100;scoreEl.textContent=score;spawnEnemy()}}}
function dash(){if(!player)return;const v=new THREE.Vector3((keys.d?1:0)-(keys.a?1:0),0,(keys.s?1:0)-(keys.w?1:0));if(v.length())player.position.add(v.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw).multiplyScalar(3))}
function loop(){if(!running)return;const dt=Math.min(clock.getDelta(),.04),f=(keys.w?1:0)-(keys.s?1:0),q=(keys.d?1:0)-(keys.a?1:0);let v=new THREE.Vector3(q,0,f);if(v.length()){v.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw);player.position.addScaledVector(v,dt*6);player.rotation.y=yaw;playAnim('Walking')}else playAnim('Idle');if(mixer)mixer.update(dt);for(const e of enemies){const d=player.position.clone().sub(e.position);d.y=0;if(d.length()>1.5)e.position.addScaledVector(d.normalize(),dt*(1.1+score/6000));else{hp-=dt*7;life.style.width=Math.max(0,hp)+'%'}}const camOffset=new THREE.Vector3(Math.sin(yaw)*6,3.2+pitch*2,Math.cos(yaw)*6);camera.position.lerp(player.position.clone().add(camOffset),.1);camera.lookAt(player.position.clone().add(new THREE.Vector3(0,1.2,0)));renderer.render(scene,camera)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
</script></body></html>
