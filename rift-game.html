<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIFT — Ludivia</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#05060b;color:#fff;font-family:system-ui}canvas{display:block}.ui{position:fixed;inset:0;pointer-events:none}.hud{display:flex;justify-content:space-between;padding:18px;font-weight:900;text-shadow:0 2px 10px #000}.panel{background:#07101dcc;border:1px solid #33415f;border-radius:14px;padding:10px 14px}.bar{width:180px;height:8px;background:#20283b;border-radius:9px;margin-top:6px;overflow:hidden}.bar span{display:block;height:100%;width:100%;background:#39e6a5}.help{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#07101dcc;border:1px solid #33415f;border-radius:14px;padding:10px 15px;color:#c4d0e8;font-size:13px}.start{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#172c55,#03050a 65%);z-index:4}.card{width:min(650px,88%);padding:40px;text-align:center;border:1px solid #3b4d72;border-radius:28px;background:#07101eee;box-shadow:0 35px 100px #000}.card h1{font-size:clamp(60px,12vw,120px);margin:0;letter-spacing:-.08em}.card p{color:#aab8d3;line-height:1.6}.btn{pointer-events:auto;padding:15px 25px;border:0;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#22d3ee);color:white;font-weight:950;font-size:15px}</style></head><body><div class="start" id="start"><div class="card"><small>LUDIVIA ORIGINAL</small><h1>RIFT</h1><p>Explore une zone 3D, contrôle ton personnage, affronte les sentinelles et découvre une première vraie boucle de combat.</p><button class="btn" id="play">JOUER</button></div></div><div class="ui"><div class="hud"><div class="panel">VITALITÉ<div class="bar"><span id="life"></span></div></div><div class="panel">SCORE <b id="score">0</b></div></div><div class="help">WASD · courir &nbsp; | &nbsp; ESPACE · esquive &nbsp; | &nbsp; SOURIS · caméra &nbsp; | &nbsp; CLIC · attaque</div></div><script type="module">import*as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';import{GLTFLoader}from'https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/loaders/GLTFLoader.js';let s,c,r,clock,p,anim,actions={},en=[],keys={},yaw=0,pitch=-.2,hp=100,score=0,lastAttack=0;const start=document.getElementById('start'),life=document.getElementById('life'),sc=document.getElementById('score');document.getElementById('play').onclick=()=>{start.remove();init()};async function init(){s=new THREE.Scene();s.background=new THREE.Color(0x050812);s.fog=new THREE.Fog(0x050812,18,75);c=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.05,150);r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;document.body.prepend(r.domElement);s.add(new THREE.HemisphereLight(0xbad8ff,0x10101d,2));let sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(8,18,8);sun.castShadow=true;s.add(sun);let ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({color:0x101829,roughness:.9}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;s.add(ground);for(let i=0;i<20;i++){let b=new THREE.Mesh(new THREE.BoxGeometry(2+Math.random()*5,2+Math.random()*8,2+Math.random()*5),new THREE.MeshStandardMaterial({color:0x18253b,metalness:.3,roughness:.7}));b.position.set((Math.random()-.5)*70,b.geometry.parameters.height/2,(Math.random()-.5)*70);b.castShadow=true;s.add(b)}p=new THREE.Group();p.position.y=0;s.add(p);const loader=new GLTFLoader();try{const gltf=await new Promise((ok,no)=>loader.load('https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb',ok,undefined,no));const model=gltf.scene;model.scale.setScalar(1.05);model.traverse(o=>{if(o.isMesh)o.castShadow=true});p.add(model);anim=new THREE.AnimationMixer(model);for(const clip of gltf.animations)actions[clip.name]=anim.clipAction(clip);playAnim('Idle')}catch(e){const body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,.9,8,16),new THREE.MeshStandardMaterial({color:0x22d3ee,metalness:.4}));body.position.y=1;p.add(body)}for(let i=0;i<7;i++)spawn();clock=new THREE.Clock();addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')dash()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('resize',resize);r.domElement.addEventListener('mousemove',e=>{if(document.pointerLockElement===r.domElement){yaw-=e.movementX*.002;pitch=Math.max(-.7,Math.min(.35,pitch-e.movementY*.002))}});r.domElement.addEventListener('click',()=>{r.domElement.requestPointerLock();attack()});r.setAnimationLoop(loop)}function playAnim(n){if(!actions[n])return;Object.values(actions).forEach(a=>a.stop());actions[n].reset().fadeIn(.15).play()}function spawn(){let e=new THREE.Mesh(new THREE.IcosahedronGeometry(.65,2),new THREE.MeshStandardMaterial({color:0xff426f,emissive:0x4a081d,emissiveIntensity:1.3}));e.position.set((Math.random()-.5)*55,.7,(Math.random()-.5)*55);e.castShadow=true;s.add(e);en.push(e)}function attack(){if(performance.now()-lastAttack<400)return;lastAttack=performance.now();playAnim('Walking');setTimeout(()=>playAnim('Idle'),300);for(let i=en.length-1;i>=0;i--){if(en[i].position.distanceTo(p.position)<3){s.remove(en[i]);en.splice(i,1);score+=100;sc.textContent=score;spawn()}}}function dash(){const v=new THREE.Vector3((keys.d?1:0)-(keys.a?1:0),0,(keys.s?1:0)-(keys.w?1:0));if(v.length())p.position.add(v.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw).multiplyScalar(3))}function loop(){let dt=Math.min(clock.getDelta(),.04);let f=(keys.w?1:0)-(keys.s?1:0),q=(keys.d?1:0)-(keys.a?1:0),v=new THREE.Vector3(q,0,f);if(v.length()){v.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw);p.position.addScaledVector(v,dt*6);p.rotation.y=yaw;playAnim('Walking')}else playAnim('Idle');if(anim)anim.update(dt);for(const e of en){let d=p.position.clone().sub(e.position);d.y=0;if(d.length()>1.5)e.position.addScaledVector(d.normalize(),dt*(1.1+score/6000));else{hp-=dt*7;life.style.width=Math.max(0,hp)+'%'}}const camOffset=new THREE.Vector3(Math.sin(yaw)*6,3.2+pitch*2,Math.cos(yaw)*6);c.position.lerp(p.position.clone().add(camOffset),.1);c.lookAt(p.position.clone().add(new THREE.Vector3(0,1.2,0)));r.render(s,c)}function resize(){c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)}</script></body></html>
