name: Narrative memory test

on:
  push:
    branches:
      - feat/narrative-memory
  pull_request:
    branches:
      - main

jobs:
  memory-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies without model bootstrap
        working-directory: server
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify 47B model configuration
        working-directory: server
        run: |
          node -e 'const p=require("./package.json"); if(!p.dependencies["node-llama-cpp"]){process.exit(1)}'
          test -f download-local-model.js
          test -f local-llm.js
      - name: Run narrative memory self-test without model
        working-directory: server
        run: |
          node -e 'import("./app.js").then(async()=>{const r=await fetch("http://127.0.0.1:10000/test/memory"); const j=await r.json(); if(!j.ok) process.exit(1); console.log(JSON.stringify(j)); process.exit(0)}).catch(e=>{console.error(e);process.exit(1)})' &
          pid=$!
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:10000/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:10000/test/memory
          kill "$pid" || true
      - name: Check Render blueprint
        run: |
          grep -q 'plan: pro ultra' render.yaml
          grep -q 'mountPath: /var/data/etsi-ai' render.yaml
          grep -q 'sizeGB: 25' render.yaml
