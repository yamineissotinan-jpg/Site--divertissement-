name: Et Si? 47B configuration check

on:
  push:
    branches: [feat/etsi-47b-production]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install server dependencies without model bootstrap
        working-directory: server
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        working-directory: server
        run: |
          node --check app.js
          node --check ai-provider.js
          node --check local-llm.js
          node --check download-local-model.js
          node --check preflight.js
      - name: Check 47B blueprint
        run: |
          grep -q 'plan: pro ultra' render.yaml
          grep -q 'sizeGB: 25' render.yaml
          grep -q 'Q3_K_M' render.yaml
          test -f server/local-llm.js
          test -f server/download-local-model.js
