<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ludivia — Rift 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#03050a;color:#fff;font-family:system-ui}#ui{position:fixed;z-index:3;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:18px;font-weight:800;text-shadow:0 2px 8px #000}.bar{width:180px;height:10px;background:#182033;border-radius:20px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;width:100%;background:#39e6a5}.help{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 16px;background:#07101dcc;border:1px solid #2b3b59;border-radius:14px;color:#b9c7df}#start{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(circle,#16254c,#02040a 65%)}.card{text-align:center;width:min(650px,90%);padding:40px;border:1px solid #34486e;border-radius:28px;background:#07101eee;box-shadow:0 30px 100px #000}.card h1{font-size:clamp(55px,11vw,110px);margin:0;letter-spacing:-.07em}.card p{color:#9fb0ce;line-height:1.6}.btn{pointer-events:auto;border:0;border-radius:15px;padding:15px 28px;background:linear-gradient(135deg,#7c3aed,#22d3ee);color:#fff;font-weight:900;font-size:16px}</style></head><body><div id="start"><div class="card"><small>LUDIVIA ORIGINAL</small><h1>RIFT 3D</h1><p>Un véritable terrain 3D dans ton navigateur. Déplace ton personnage, cours, vise et affronte les drones.</p><button class="btn" id="play">ENTRER DANS LE RIFT</button></div></div><div id="ui"><div class="top"><div>RIFT 3D<div class="bar"><i id="hp"></i></div></div><div>Score <b id="score">0</b></div></div><div class="help">WASD : déplacement · Souris : caméra · Clic : attaque · Espace : esquive</div></div><script type="module">import*as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';let scene,camera,renderer,hero,clock,enemies=[],keys={},score=0,hp=100,started=false,vel=new THREE.Vector3(),yaw=0,pitch=0;const start=document.querySelector('#start'),scoreEl=document.querySelector('#score'),hpEl=document.querySelector('#hp');document.querySelector('#play').onclick=()=>{start.style.display='none';init()};function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x030712);scene.fog=new THREE.Fog(0x030712,18,70);camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,100);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);clock=new THREE.Clock();scene.add(new THREE.HemisphereLight(0x9bdcff,0x101020,2));let sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(8,15,5);sun.castShadow=true;scene.add(sun);let floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x0b1324,roughness:.8,metalness:.15}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);for(let i=-40;i<=40;i+=4){let m=new THREE.Mesh(new THREE.BoxGeometry(.03,.03,80),new THREE.MeshBasicMaterial({color:0x18345c}));m.position.set(i,.01,0);scene.add(m);let n=m.clone();n.rotation.y=Math.PI/2;n.position.set(0,.02,i);scene.add(n)}hero=new THREE.Group();let body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.9,6,12),new THREE.MeshStandardMaterial({color:0x22d3ee,metalness:.5,roughness:.3}));body.castShadow=true;hero.add(body);let visor=new THREE.Mesh(new THREE.BoxGeometry(.55,.18,.16),new THREE.MeshStandardMaterial({color:0x111827,emissive:0x22d3ee,emissiveIntensity:1.5}));visor.position.set(0,.35,-.37);hero.add(visor);hero.position.set(0,.95,0);scene.add(hero);camera.position.set(0,3.4,6);camera.lookAt(hero.position);for(let i=0;i<8;i++)spawnEnemy();addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')dash()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('resize',resize);renderer.domElement.addEventListener('click',shoot);renderer.domElement.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.002;pitch=Math.max(-.6,Math.min(.6,pitch-e.movementY*.002))}});renderer.domElement.addEventListener('click',()=>renderer.domElement.requestPointerLock());renderer.setAnimationLoop(loop)}function spawnEnemy(){let e=new THREE.Mesh(new THREE.IcosahedronGeometry(.55,1),new THREE.MeshStandardMaterial({color:0xfb3b6b,emissive:0x5b1029,emissiveIntensity:1}));e.position.set((Math.random()-.5)*35,.65,(Math.random()-.5)*35);e.castShadow=true;scene.add(e);enemies.push(e)}function shoot(){if(!started)return;let ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(0,0),camera);let hit=ray.intersectObjects(enemies);if(hit.length){let e=hit[0].object;scene.remove(e);enemies=enemies.filter(x=>x!==e);score+=100;scoreEl.textContent=score;spawnEnemy()}}function dash(){if(vel.length()>0)hero.position.add(vel.clone().normalize().multiplyScalar(2.5))}function loop(){let dt=Math.min(clock.getDelta(),.05);let f=(keys.w?1:0)-(keys.s?1:0),r=(keys.d?1:0)-(keys.a?1:0);let dir=new THREE.Vector3(r,0,f);if(dir.length())dir.normalize();dir.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);vel.lerp(dir.multiplyScalar(7),1-Math.pow(.001,dt));hero.position.addScaledVector(vel,dt);hero.position.x=Math.max(-45,Math.min(45,hero.position.x));hero.position.z=Math.max(-45,Math.min(45,hero.position.z));hero.rotation.y=yaw;for(let e of enemies){let d=hero.position.clone().sub(e.position);d.y=0;if(d.length()>1.25)e.position.addScaledVector(d.normalize(),dt*(1.2+score/4000));else{hp-=dt*8;hpEl.style.width=Math.max(0,hp)+'%'}}let target=new THREE.Vector3(hero.position.x+Math.sin(yaw)*6,hero.position.y+3.2,hero.position.z+Math.cos(yaw)*6);camera.position.lerp(target,.1);camera.lookAt(hero.position.clone().add(new THREE.Vector3(0,1,0)));renderer.render(scene,camera)}function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
</script></body></html>
