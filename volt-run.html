<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ludivia — VOLT RUN</title><style>body{margin:0;background:#050812;color:#fff;font:16px system-ui;text-align:center}main{max-width:900px;margin:auto;padding:20px}canvas{width:100%;height:auto;background:linear-gradient(#101a3a,#07101b);border:1px solid #2b3b62;border-radius:20px;touch-action:none}.btn{padding:13px 20px;border:0;border-radius:12px;background:#22d3ee;font-weight:900}.hud{display:flex;justify-content:space-around;margin:12px}</style></head><body><main><h1>⚡ VOLT RUN</h1><div class="hud">Score <b id="s">0</b> · Record <b id="b">0</b></div><canvas id="c" width="900" height="500"></canvas><p>ESPACE / TAP = sauter · A/D ou ←/→ = changer de voie</p><button class="btn" id="start">COMMENCER</button></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),S=document.querySelector('#s'),B=document.querySelector('#b');let run=0,px=130,py=410,vy=0,lane=1,obs=[],score=0,t=0,last=0,best=+localStorage.vb||0;B.textContent=best;function jump(){if(py>=410)vy=-650}function key(e){if(e.code==='Space')jump();if(e.key==='ArrowLeft'||e.key==='a')lane=Math.max(0,lane-1);if(e.key==='ArrowRight'||e.key==='d')lane=Math.min(2,lane+1)}onkeydown=key;c.onpointerdown=jump;document.querySelector('#start').onclick=()=>{run=1;score=0;obs=[];t=0;last=performance.now();requestAnimationFrame(loop)};function loop(now){if(!run)return;let dt=Math.min(.03,(now-last)/1000);last=now;t+=dt;score+=Math.floor(dt*100);S.textContent=score;py+=vy*dt;vy+=1600*dt;if(py>410){py=410;vy=0}if(t>(.8+Math.random())){t=0;obs.push({x:920,l:Math.floor(Math.random()*3),h:35+Math.random()*55})}x.clearRect(0,0,900,500);x.fillStyle='#0b1325';x.fillRect(0,430,900,70);for(let i=obs.length-1;i>=0;i--){let o=obs[i];o.x-=430*dt;let ox=170+o.l*250;x.fillStyle='#fb7185';x.fillRect(o.x,430-o.h,45,o.h);if(o.x<px+25&&o.x+45>px-25&&o.l===lane&&py>430-o.h-35){run=0;best=Math.max(best,score);localStorage.vb=best;B.textContent=best;document.querySelector('#start').textContent='REJOUER'}if(o.x<-60)obs.splice(i,1)}x.fillStyle='#22d3ee';x.shadowBlur=25;x.shadowColor='#22d3ee';x.beginPath();x.arc(px,py,25,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#9ca9c8';for(let i=0;i<3;i++)x.fillRect(140+i*250,455,150,4);requestAnimationFrame(loop)}</script></body></html>
