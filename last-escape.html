<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ludivia — LAST ESCAPE</title><style>body{margin:0;background:#090505;color:#fff;font:16px system-ui;text-align:center}main{max-width:900px;margin:auto;padding:20px}.arena{position:relative;height:560px;border:1px solid #513332;border-radius:22px;overflow:hidden;background:linear-gradient(#1d1512,#090505)}.player{position:absolute;width:34px;height:34px;background:#fff;border-radius:9px;box-shadow:0 0 30px #fff;transform:translate(-50%,-50%)}.rock{position:absolute;background:#fb7185;border-radius:8px;box-shadow:0 0 20px #fb7185}.exit{position:absolute;right:4%;top:45%;padding:12px;border:2px solid #34d399;color:#34d399;border-radius:10px}.btn{padding:13px 20px;border:0;border-radius:12px;background:#fb7185;color:#fff;font-weight:900}</style></head><body><main><h1>🌋 LAST ESCAPE</h1><p>Le monde s'effondre. Atteins la sortie avant d'être rattrapé.</p><div class="arena" id="a"><div class="exit">SORTIE</div></div><p>Distance : <b id="d">0</b> m · Temps : <b id="t">0</b>s</p><button class="btn" id="go">FUIR</button></main><script>const a=document.querySelector('#a'),d=document.querySelector('#d'),tm=document.querySelector('#t');let p,rocks=[],run=0,x=.08,y=.5,start=0,last=0;function q(n,x,y){n.style.left=x*100+'%';n.style.top=y*100+'%'}a.onpointermove=e=>{if(!run)return;let r=a.getBoundingClientRect();x=Math.max(.03,Math.min(.92,(e.clientX-r.left)/r.width));y=Math.max(.05,Math.min(.95,(e.clientY-r.top)/r.height));q(p,x,y)}function begin(){a.querySelectorAll('.player,.rock').forEach(n=>n.remove());rocks=[];x=.08;y=.5;p=document.createElement('div');p.className='player';a.append(p);q(p,x,y);run=1;start=last=performance.now();requestAnimationFrame(loop)}document.querySelector('#go').onclick=begin;function spawn(){let n=document.createElement('div');n.className='rock';let h=.05+Math.random()*.13;n.style.width=(.03+Math.random()*.06)*100+'%';n.style.height=h*100+'%';a.append(n);rocks.push({x:1.05,y:Math.random(),n,v:.18+Math.random()*.16})}function loop(t){if(!run)return;let dt=Math.min(.04,(t-last)/1000);last=t;if(Math.random()<dt*.9)spawn();rocks.forEach(r=>{r.x-=r.v*dt;q(r.n,r.x,r.y);if(Math.hypot(x-r.x,y-r.y)<.065){run=0;document.querySelector('#go').textContent='RECOMMENCER'}});rocks=rocks.filter(r=>r.x>-.1);let sec=(t-start)/1000;d.textContent=Math.floor(sec*22);tm.textContent=sec.toFixed(1);if(x>.92){run=0;document.querySelector('#go').textContent='VICTOIRE !'}requestAnimationFrame(loop)}</script></body></html>
