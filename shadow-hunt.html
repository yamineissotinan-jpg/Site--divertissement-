<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ludivia — SHADOW HUNT</title><style>body{margin:0;background:#03050b;color:#fff;font:16px system-ui;text-align:center}main{max-width:850px;margin:auto;padding:20px}.arena{position:relative;height:min(70vh,600px);min-height:420px;border:1px solid #303852;border-radius:22px;background:radial-gradient(circle,#18213b,#03050b 65%);overflow:hidden;touch-action:none}.you,.shadow{position:absolute;transform:translate(-50%,-50%);border-radius:50%}.you{width:28px;height:28px;background:#22d3ee;box-shadow:0 0 35px #22d3ee}.shadow{width:34px;height:34px;background:#fb7185;box-shadow:0 0 25px #fb7185}.btn{padding:13px 20px;border:0;border-radius:12px;background:#8b5cf6;color:white;font-weight:900}</style></head><body><main><h1>🌑 SHADOW HUNT</h1><p>Repère les chasseurs avant qu'ils ne te touchent.</p><div class="arena" id="a"></div><p>Score : <b id="s">0</b> · Vies : <b id="h">3</b></p><button class="btn" id="go">COMMENCER</button></main><script>const a=document.querySelector('#a'),s=document.querySelector('#s'),h=document.querySelector('#h');let p,e=[],run=0,score=0,hp=3,last=0;function q(n,x,y){n.style.left=x*100+'%';n.style.top=y*100+'%'}a.onpointerdown=v=>{if(!run)return;let r=a.getBoundingClientRect();p.x=(v.clientX-r.left)/r.width;p.y=(v.clientY-r.top)/r.height;q(p.n,p.x,p.y)}document.querySelector('#go').onclick=()=>{a.innerHTML='';p={x:.5,y:.5,n:document.createElement('div')};p.n.className='you';a.append(p.n);e=[];score=0;hp=3;run=1;last=performance.now();loop(last)}function spawn(){let n=document.createElement('div');n.className='shadow';a.append(n);e.push({x:Math.random(),y:Math.random(),n})}function loop(t){if(!run)return;let dt=Math.min(.04,(t-last)/1000);last=t;if(Math.random()<dt*(.8+score/700))spawn();e.forEach(v=>{let dx=p.x-v.x,dy=p.y-v.y,z=Math.hypot(dx,dy)||1;v.x+=dx/z*dt*.12;v.y+=dy/z*dt*.12;q(v.n,v.x,v.y);if(z<.055){hp--;h.textContent=hp;v.x=Math.random();v.y=Math.random();if(hp<=0){run=0;document.querySelector('#go').textContent='REJOUER'}}});score+=Math.floor(dt*50);s.textContent=score;q(p.n,p.x,p.y);requestAnimationFrame(loop)}</script></body></html>
