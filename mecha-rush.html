<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ludivia — MECHA RUSH</title><style>body{margin:0;background:#07070c;color:#fff;font:16px system-ui;text-align:center}main{max-width:900px;margin:auto;padding:20px}.arena{position:relative;height:550px;border:1px solid #3b4258;border-radius:22px;overflow:hidden;background:radial-gradient(circle,#27251b,#09090e 65%)}.bot,.foe{position:absolute;transform:translate(-50%,-50%);border-radius:12px}.bot{width:46px;height:46px;background:#fbbf24;box-shadow:0 0 30px #fbbf24}.foe{width:32px;height:32px;background:#fb7185;box-shadow:0 0 20px #fb7185}.btn{padding:13px 20px;border:0;border-radius:12px;background:#fbbf24;font-weight:900}.hud{margin:10px}</style></head><body><main><h1>🤖 MECHA RUSH</h1><div class="hud">Vague <b id="w">1</b> · Score <b id="s">0</b> · ❤️ <b id="hp">100</b></div><div class="arena" id="a"></div><p>Clique sur les ennemis pour les détruire. Déplace ton robot avec la souris ou le doigt.</p><button class="btn" id="go">COMMENCER</button></main><script>const a=document.querySelector('#a'),s=document.querySelector('#s'),w=document.querySelector('#w'),hp=document.querySelector('#hp');let p,e=[],run=0,score=0,life=100,last=0;function q(n,x,y){n.style.left=x*100+'%';n.style.top=y*100+'%'}function start(){a.innerHTML='';p={x:.5,y:.75,n:document.createElement('div')};p.n.className='bot';a.append(p.n);e=[];score=0;life=100;run=1;last=performance.now();loop(last)}a.onpointermove=v=>{if(!run)return;let r=a.getBoundingClientRect();p.x=(v.clientX-r.left)/r.width;p.y=(v.clientY-r.top)/r.height;q(p.n,p.x,p.y)}a.onclick=v=>{if(!run)return;let r=a.getBoundingClientRect(),x=(v.clientX-r.left)/r.width,y=(v.clientY-r.top)/r.height;for(let i=e.length-1;i>=0;i--)if(Math.hypot(x-e[i].x,y-e[i].y)<.07){e[i].n.remove();e.splice(i,1);score+=30;break}}document.querySelector('#go').onclick=start;function spawn(){let n=document.createElement('div');n.className='foe';a.append(n);e.push({x:.05+Math.random()*.9,y:.05,n})}function loop(t){if(!run)return;let dt=Math.min(.04,(t-last)/1000);last=t;if(Math.random()<dt*(1+score/900))spawn();e.forEach(v=>{v.y+=dt*(.08+score/5000);q(v.n,v.x,v.y);if(v.y>p.y-.05&&Math.abs(v.x-p.x)<.08){life-=20;v.n.remove();v.dead=1}});e=e.filter(v=>!v.dead);if(life<=0){run=0;document.querySelector('#go').textContent='REJOUER'}score+=Math.floor(dt*20);s.textContent=score;hp.textContent=life;w.textContent=Math.floor(score/250)+1;q(p.n,p.x,p.y);requestAnimationFrame(loop)}</script></body></html>
