services:
  - type: web
    name: etsi-ai
    runtime: node
    region: frankfurt
    rootDir: .
    buildCommand: cd server && npm ci
    startCommand: cd server && npm start
    plan: pro ultra
    healthCheckPath: /health
    disk:
      name: etsi-ai-models
      mountPath: /var/data/etsi-ai
      sizeGB: 25
    envVars:
      - key: LOCAL_MODEL_PATH
        value: /var/data/etsi-ai/mixtral-8x7b-instruct-v0.1.Q3_K_M.gguf
      - key: LOCAL_MODEL_URL
        value: https://huggingface.co/TheBloke/Mixtral-8x7B-Instruct-v0.1-GGUF/resolve/main/mixtral-8x7b-instruct-v0.1.Q3_K_M.gguf?download=true
      - key: LOCAL_MODEL_NAME
        value: Mixtral-8x7B-Instruct-v0.1-Q3_K_M-GGUF-47B
      - key: LOCAL_CONTEXT_SIZE
        value: "2048"
      - key: LOCAL_THREADS
        value: "8"
      - key: MODEL_MIN_BYTES
        value: "19000000000"
